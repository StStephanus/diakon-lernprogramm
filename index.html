function renderHymn(){
  const {hymn, station} = findHymn(state.currentHymnId);
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "" + T(station.title);
  crumb.addEventListener("click", ()=>{ state.view="station"; render(); });
  wrap.appendChild(crumb);

  if(!hymnUnlocked(hymn, state.profile.stufe)){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>${T("Noch gesperrt")}</h3><p>${T("Diese Antwort gehört zu Stufe {n} — sie wird freigeschaltet, sobald du diese Stufe erreichst.", {n:hymn.tier})}</p>`;
    wrap.appendChild(empty);
    return wrap;
  }

  const titleRow = document.createElement("div");
  titleRow.style.cssText = "display:flex; align-items:center; gap:10px; flex-wrap:wrap;";
  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = T(hymn.title);
  titleRow.appendChild(title);
  if(hymn.difficulty){
    const diffSpan = document.createElement("span");
    diffSpan.className = "diff-badge " + hymn.difficulty;
    diffSpan.textContent = T(hymn.difficulty);
    titleRow.appendChild(diffSpan);
  }
  if(hymn.mandatory===false){
    const voluntSpan = document.createElement("span");
    voluntSpan.className = "volunt-badge";
    voluntSpan.textContent = T("freiwillig");
    titleRow.appendChild(voluntSpan);
  }
  wrap.appendChild(titleRow);

  const woText = hymnWo(hymn, station);
  const woBox = document.createElement("div");
  woBox.className = "info-box" + (woText ? "" : " leer");
  woBox.innerHTML = `<span class="ib-title">${T("Wo in der Liturgie?")}</span><span class="ib-body">${woText ? T(woText) : T("Hier steht bald, an welcher Stelle der Liturgie diese Antwort gesungen wird.")}</span>`;
  wrap.appendChild(woBox);

  const hymnLangs = LANGS.filter(l => hymn.content[l.code]);
  if(!hymn.content[state.currentLang]) state.currentLang = hymnLangs[0].code;

  const tabs = document.createElement("div");
  tabs.className = "lang-tabs";
  hymnLangs.forEach(l=>{
    const b = document.createElement("button");
    b.className = "lang-tab" + (state.currentLang===l.code? " active":"");
    b.textContent = T(l.label);
    b.addEventListener("click", ()=>{ state.currentLang=l.code; render(); });
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);
  if(hymnLangs.length < LANGS.length){
    const note = document.createElement("p");
    note.style.cssText = "color:var(--muted); font-size:12px; margin-top:-14px; margin-bottom:18px;";
    note.textContent = T("Diese Antwort wird bei uns nur in {langs} gesungen.", {langs: hymnLangs.map(l=>T(l.label)).join(T(" und "))});
    wrap.appendChild(note);
  }

  const content = hymn.content[state.currentLang];

  const player = document.createElement("div");
  player.className = "player";
  player.innerHTML = `
    <div class="player-row">
      <button class="play-btn" id="playBtn"><span class="icon-play">▶</span><span class="icon-pause"><span></span><span></span></span></button>
      <button class="stop-btn" id="stopBtn" title="${T("Stopp")}">■</button>
      <div>
        <div style="font-weight:600;">${T("Aufnahme anhören")}</div>
        <div class="audio-note" id="audioStatus">${T("Bereit")}</div>
      </div>
    </div>
    <div class="seek-row">
      <span class="seek-time" id="seekCurrent">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" />
      <span class="seek-time total" id="seekTotal">0:00</span>
    </div>
  `;
  const statusEl = player.querySelector("#audioStatus");
  const playBtn = player.querySelector("#playBtn");
  const stopBtn = player.querySelector("#stopBtn");
  const seekBar = player.querySelector("#seekBar");
  const seekCurrentEl = player.querySelector("#seekCurrent");
  const seekTotalEl = player.querySelector("#seekTotal");
  const formatTime = (t)=>{
    if(!isFinite(t) || t<0) t = 0;
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ":" + (s<10? "0":"") + s;
  };
  let userIsSeeking = false;
  const thisKey = hymn.id + "_" + state.currentLang;
  const setStatus = (s)=>{
    if(s==="loading"){ statusEl.textContent = T("Lädt …"); playBtn.classList.remove("show-pause"); }
    else if(s==="playing"){ statusEl.textContent = T("Spielt ab …"); playBtn.classList.add("show-pause"); }
    else if(s==="paused"){ statusEl.textContent = T("Pausiert"); playBtn.classList.remove("show-pause"); }
    else if(s==="missing"){ statusEl.textContent = T("Keine Aufnahme für diese Sprache hinterlegt (Platzhalter-Ton)"); playBtn.classList.remove("show-pause"); }
    else { statusEl.textContent = T("Bereit"); playBtn.classList.remove("show-pause"); }
  };
  const setTime = (cur, dur)=>{
    if(userIsSeeking) return;
    seekCurrentEl.textContent = formatTime(cur);
    seekTotalEl.textContent = formatTime(dur);
    seekBar.value = dur>0 ? Math.round((cur/dur)*1000) : 0;
  };
  // Falls dieselbe Aufnahme (gleiche Antwort + Sprache) schon läuft/pausiert ist (z. B. weil
  // der Nutzer zwischendurch nur den Selbst-geübt-Haken gesetzt hat und die Seite neu
  // gezeichnet wurde), spiegelt die Anzeige direkt deren aktuellen Zustand statt "Bereit".
  if(currentAudioKey === thisKey && currentAudioEl){
    setStatus(currentAudioEl.paused ? "paused" : "playing");
    setTime(currentAudioEl.currentTime, currentAudioEl.duration || 0);
  }
  playBtn.addEventListener("click", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl){
      if(currentAudioEl.paused) currentAudioEl.play().catch(()=>{});
      else currentAudioEl.pause();
    } else {
      playHymnAudio(hymn.id, state.currentLang, { onStatus: setStatus, onTime: setTime });
    }
  });
  stopBtn.addEventListener("click", ()=>{
    stopHymnAudio();
    setStatus("idle");
    setTime(0, 0);
  });
  seekBar.addEventListener("input", ()=>{ userIsSeeking = true; });
  seekBar.addEventListener("change", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl && isFinite(currentAudioEl.duration)){
      currentAudioEl.currentTime = (seekBar.value/1000) * currentAudioEl.duration;
    }
    userIsSeeking = false;
  });
  wrap.appendChild(player);

  wrap.appendChild(readTools());
  const textBlock = document.createElement("div");
  textBlock.className = "text-block";
  const mainText = content.text || content.translit || "";
  if(content.html){ textBlock.innerHTML = mainText; } else { textBlock.textContent = mainText; }
  wrap.appendChild(textBlock);

  const selfRow = document.createElement("div");
  selfRow.className = "self-learn-row";
  const currentLangLabel = T(LANGS.find(l=>l.code===state.currentLang).label);
  const learned = !!(state.progress[hymn.id] && state.progress[hymn.id][state.currentLang]);
  selfRow.innerHTML = `
    <div>
      <div style="font-weight:600; font-size:15px;">${T("Ich habe das auf {lang} geübt", {lang: currentLangLabel})}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">${T("Nur dein persönlicher Fortschritt für diese Sprache — die offizielle Bestätigung gibt der Prüfer.")}</div>
    </div>
    <div class="toggle ${learned?'on':''}" id="selfToggle"><div class="knob"></div></div>
  `;
  selfRow.querySelector("#selfToggle").addEventListener("click", async ()=>{
    await setProgress(hymn.id, state.currentLang, !learned);
    render();
  });
  wrap.appendChild(selfRow);

  const certInfo = document.createElement("div");
  const certForLang = isHymnLangCertified(hymn.id, state.currentLang);
  if(certForLang){
    const rec = state.certified[hymn.id][state.currentLang];
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--tint-burg); border:1px solid var(--burgundy); border-radius:6px; font-size:13px; color:var(--burg-t); font-weight:600;";
    certInfo.textContent = T("✓ Auf {lang} vom Prüfer bestätigt ({by}, {date}) — du kannst trotzdem jederzeit weiter üben.", {lang: currentLangLabel, by: rec.by, date: rec.date});
  } else {
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--parchment-2); border:1px solid var(--line); border-radius:6px; font-size:13px; color:var(--muted);";
    certInfo.textContent = T("Auf {lang} noch nicht vom Prüfer bestätigt. Geh zu einem Prüfer in der Kirche, um diese Antwort in dieser Sprache vorzusingen.", {lang: currentLangLabel});
  }
  wrap.appendChild(certInfo);

  return wrap;
}

function renderStufenZertifikat(){
  const stufe = state.stufenZertifikatStufe;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = T("Zurück");
  crumb.addEventListener("click", ()=>{ state.view="home"; state.stufenZertifikatStufe=null; render(); });
  wrap.appendChild(crumb);

  // Alle Pflicht-Hymnen dieser Stufe einsammeln, um das letzte Bestätigungsdatum zu bestimmen
  const hymnIdsOfStufe = [];
  STATIONS.forEach(s=>{
    s.hymns.forEach(h=>{
      if(h.tier===stufe && h.mandatory!==false) hymnIdsOfStufe.push(h.id);
    });
  });
  const dates = hymnIdsOfStufe
    .map(id=>{
      const langs = certifiedLangsFor(id);
      const entries = langs.map(l=> state.certified[id] && state.certified[id][l]).filter(Boolean);
      return entries.map(e=>e.date).filter(Boolean);
    })
    .flat()
    .sort();
  const lastDate = dates.length? dates[dates.length-1] : new Date().toLocaleDateString("de-CH");

  const stufeNamen = { 1: T("Stufe 1"), 2: T("Stufe 2"), 3: T("Stufe 3") };
  const stufeAlter = { 1: T("unter 12 Jahren"), 2: T("zwischen 12 und 20 Jahren"), 3: T("ab 20 Jahren") };

  const cert = document.createElement("div");
  cert.className = "certificate";
  cert.innerHTML = `
    <div class="kicker">${T("KOPTISCH-ORTHODOXE KIRCHE ZÜRICH")}</div>
    <h2 class="serif">${T("Diakonenzertifikat der Stufe {n}", {n:stufe})}</h2>
    <div style="font-size:14px; color:var(--muted); margin-top:10px;">${T("verliehen an")}</div>
    <div class="name">${state.profile.name}</div>
    <div class="desc">${T("hat alle Pflicht-Antworten der <strong>{stufe}</strong> (Altersgruppe {alter}) erfolgreich vor einem Verantwortlichen der Gemeinde vorgetragen und ist damit berechtigt, diese Antworten ab sofort in der Liturgie vorzutragen.", {stufe: (stufeNamen[stufe] || ("Stufe " + stufe)), alter: (stufeAlter[stufe] || "")})}</div>
    <div class="date">${T("Abgeschlossen am {date}", {date:lastDate})}</div>
  `;
  wrap.appendChild(cert);

  const printBtn = document.createElement("button");
  printBtn.className = "btn secondary";
  printBtn.style.marginTop = "18px";
  printBtn.textContent = T("Drucken / als PDF speichern");
  printBtn.addEventListener("click", ()=> window.print());
  wrap.appendChild(printBtn);

  return wrap;
}

        state.pruefer_progress = {};
        (data||[]).forEach(row=>{
          if(!state.pruefer_progress[row.hymn_id]) state.pruefer_progress[row.hymn_id] = {};
          state.pruefer_progress[row.hymn_id][row.lang] = row.learned;
        });
        state.view = "pruefer-station";
        render();
      });
    });
    row.querySelector(".diakon-pw").addEventListener("click", async (e)=>{
      e.stopPropagation();
      const pw = prompt(`Neues Passwort für "${fullName}" (mindestens 6 Zeichen):`);
      if(pw === null) return;
      if(pw.length < 6){ alert("Das Passwort muss mindestens 6 Zeichen haben."); return; }
      const r = await resetDiakonPassword(u.id, pw);
      alert(r.ok ? `Passwort für "${fullName}" wurde geändert. Teile es dem Diakon mit; er kann es nach der Anmeldung nutzen.` : r.msg);
    });
    row.querySelector(".diakon-delete").addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(!confirm(`"${fullName}" wirklich vollständig löschen? Profil, Fortschritt und alle Bestätigungen werden entfernt. Das kann nicht rückgängig gemacht werden.`)) return;
      await deleteDiakon(u.id);
      state.allDiakone = await loadAllDiakone();
      render();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderPrueferStation(){
  const u = state.pruefer_selectedDiakon;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "Alle Diakone";
  crumb.addEventListener("click", ()=>{ state.view="pruefer-home"; render(); });
  wrap.appendChild(crumb);

  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = u.name;
  wrap.appendChild(title);

  const sub = document.createElement("p");
  sub.style.cssText = "color:var(--muted); font-size:13px; margin-top:6px;";
  sub.textContent = "Bestätige jede Antwort einzeln, nachdem sie dir vorgesungen wurde. Angemeldet als: " + state.prueferName;
  wrap.appendChild(sub);

  if(u.stufe < 3 && tierFullyCertified(u.stufe)){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--tint-gold); border:1px solid var(--gold); border-radius:6px; font-size:13px;";
    banner.textContent = `Stufe ${u.stufe} ist vollständig bestätigt. Beim nächsten Login von ${u.name} wird automatisch Stufe ${u.stufe+1} freigeschaltet.`;
    wrap.appendChild(banner);
  }

  STATIONS.forEach((s,i)=>{
    if(s.hymns.length===0) return;
    const stationHeader = document.createElement("h3");
    stationHeader.className = "serif";
    stationHeader.style.cssText = "font-size:18px; margin-top:26px; margin-bottom:4px;";
    stationHeader.textContent = (i+1) + ". " + s.title;
    wrap.appendChild(stationHeader);

    const list = document.createElement("div");
    s.hymns.forEach(h=>{
      const unlocked = hymnUnlocked(h, u.stufe);
      const row = document.createElement("div");
      row.className = "approve-row";
      row.style.flexDirection = "column";
      row.style.alignItems = "stretch";
      row.style.gap = "10px";

      if(!unlocked){
        row.style.opacity = ".55";
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `<b>${h.title}</b> <span class="lock-badge">🔒 ab Stufe ${h.tier}</span>`;
        row.appendChild(info);
        list.appendChild(row);
        return;
      }

      const hymnLangs = LANGS.filter(l => h.content[l.code]);
      const learnedLangCodes = LANGS.filter(l => (state.pruefer_progress[h.id]||{})[l.code]).map(l=>l.code);
      const voluntTag = h.mandatory===false ? ` <span class="volunt-badge">freiwillig</span>` : "";

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<b>${h.title}${voluntTag}</b>`;
      row.appendChild(info);

      const langRow = document.createElement("div");
      langRow.style.cssText = "display:flex; flex-wrap:wrap; gap:8px;";
      hymnLangs.forEach(l=>{
        const selfDone = learnedLangCodes.includes(l.code);
        const certified = isHymnLangCertified(h.id, l.code);
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.style.margin = "0";
        btn.style.fontSize = "13px";
        btn.style.padding = "8px 12px";
        if(certified){
          btn.style.background = "var(--sage)";
          const rec = state.certified[h.id][l.code];
          btn.textContent = `${l.label}: bestätigt (${rec.date}) — rückgängig?`;
        } else {
          btn.textContent = `${l.label}${selfDone ? " — bestätigen" : " — noch nicht selbst geübt, trotzdem bestätigen"}`;
        }
        btn.addEventListener("click", async ()=>{
          if(certified){
            if(!confirm(`Bestätigung für "${h.title}" (${l.label}) wirklich rückgängig machen?`)) return;
            btn.disabled = true; btn.textContent = "Entferne …";
            await uncertifyHymn(u.id, h.id, l.code);
            if(state.certified[h.id]) delete state.certified[h.id][l.code];
            render();
            return;
          }
          btn.disabled = true; btn.textContent = "Speichere …";
          await certifyHymn(u.id, h.id, l.code, state.prueferName);
          if(!state.certified[h.id]) state.certified[h.id] = {};
          state.certified[h.id][l.code] = {by: state.prueferName, date: new Date().toLocaleDateString("de-CH")};
          render();
        });
        langRow.appendChild(btn);
      });
      row.appendChild(langRow);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  });

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = "Alle Prüfer teilen sich aktuell ein gemeinsames Passwort. Für mehr Sicherheit könnt ihr später jedem Prüfer einen eigenen, persönlichen Zugang geben.";
  wrap.appendChild(note);

  return wrap;
}

/* ---------------- PWA: Installierbar machen + eigenes "App installieren"-Banner ----------------
   Chrome/Android/Desktop lösen das Ereignis "beforeinstallprompt" aus, wenn die Seite die
   Installierbarkeits-Kriterien erfüllt (Manifest + Service Worker vorhanden). Wir fangen es
   sofort ab (damit der Browser seinen eigenen, generischen Hinweis NICHT zeigt) und lösen
   das Installations-Fenster stattdessen selbst über unseren eigenen Banner aus, sobald sich
   jemand angemeldet hat.
   iOS/Safari kennt dieses Ereignis nicht — dort zeigen wir stattdessen eine kurze Anleitung
   ("Teilen" → "Zum Home-Bildschirm"), da iOS keine programmatische Installation erlaubt. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

let deferredInstallPrompt = null;
function isIosDevice(){
  return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
}
function isAlreadyInstalled(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function maybeShowInstallBanner(){
  if(isAlreadyInstalled()) return;
  if(localStorage.getItem("installBannerDismissed")) return;
  // Nur anzeigen, wenn jemand angemeldet ist (Diakon oder Prüfer) — nicht schon auf der Login-Seite.
  if(state.role==="diakon" && !state.profile) return;
  if(state.role==="pruefer" && !state.prueferAuthenticated) return;
  const banner = document.getElementById("installBanner");
  const text = document.getElementById("installBannerText");
  const btn = document.getElementById("installBannerBtn");
  if(!banner) return;
  if(deferredInstallPrompt){
    text.textContent = T("Diese App auf deinem Handy installieren, für schnelleren Zugriff?");
    btn.style.display = "";
    btn.textContent = T("Installieren");
  } else if(isIosDevice()){
    text.textContent = T("App installieren: Tippe unten auf \"Teilen\" und dann auf \"Zum Home-Bildschirm\".");
    btn.style.display = "none";
  } else {
    return; // kein Installations-Weg verfügbar (z. B. Browser unterstützt es nicht)
  }
  banner.style.display = "flex";
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  maybeShowInstallBanner();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerClose").addEventListener("click", ()=>{
  localStorage.setItem("installBannerDismissed", "1");
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerBtn").addEventListener("click", async ()=>{
  if(!deferredInstallPrompt) return;
  document.getElementById("installBanner").style.display = "none";
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

/* iOS zeigt :active (Einsinken beim Antippen) nur, wenn ein Touch-Listener existiert */
document.addEventListener("touchstart", function(){}, {passive:true});

/* ---------------- Start ---------------- */
async function init(){
  document.documentElement.lang = UI_LANG;
  root.innerHTML = "";
  const splashWeg = ()=>{
    const sp = document.getElementById("splash");
    if(!sp) return;
    sp.classList.add("hide");
    setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
  };
  setTimeout(splashWeg, 9000);   // Sicherheit: nie dauerhaft hängen bleiben
  await pruefeUrlHash();
  await loadProfile();
  if(state.profile){
    await loadProgress();
    state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
  }
  render();
  updateOfflineBanner();
  splashWeg();
  maybeShowInstallBanner();
}
init();
</script>
