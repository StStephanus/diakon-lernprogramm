<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pi-Eklom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- PWA: macht die Seite auf dem Handy als "App" installierbar -->
<script>
/* Der Prüfer-Zugang (…/#pruefer) bekommt eine eigene App-Identität: eigenes Icon, eigener Name, eigener Startlink. */
(function(){
  var p = location.hash === "#pruefer";
  window.IST_PRUEFER_APP = p;
  document.write(
    '<link rel="manifest" href="' + (p ? 'manifest-pruefer.json' : 'manifest.json') + '" />' +
    '<meta name="theme-color" content="' + (p ? '#1C2B44' : '#7A2333') + '" />' +
    '<link rel="apple-touch-icon" href="' + (p ? 'apple-touch-icon-pruefer.png' : 'apple-touch-icon.png') + '" />' +
    '<meta name="apple-mobile-web-app-capable" content="yes" />' +
    '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />' +
    '<meta name="apple-mobile-web-app-title" content="' + (p ? 'Pi-Eklom Prüfer' : 'Pi-Eklom') + '" />'
  );
})();
</script>
<style>
  :root{
    --ink:#241C15;
    --parchment:#F3ECDA;
    --parchment-2:#EAE1C8;
    --midnight:#1C2B44;
    --midnight-2:#28395A;
    --gold:#AD7F35;
    --gold-light:#D9BD84;
    --burgundy:#7A2333;
    --sage:#5E6E52;
    --line:#C9BC98;
    --muted:#6B6153;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:"Source Sans 3", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:"Cormorant Garamond", serif;
    font-weight:600;
    margin:0;
  }
  .app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--parchment);border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* Header */
  header.top{
    background:var(--burgundy);
    color:var(--parchment);
    padding:22px 20px 18px;
    position:relative;
    border-bottom:3px solid var(--gold);
  }
  header.top{padding:16px 16px 18px;}
  header.top .crest{
    width:min(190px, 58vw);height:min(190px, 58vw);flex:none; object-fit:cover; border-radius:50%;
    border:2px solid var(--gold); display:block; margin:0 auto;
  }
  header.top .title-frame{
    position:relative; width:100%; border:1px solid var(--gold); outline:1px solid var(--gold); outline-offset:3px;
    padding:22px 14px 18px; margin:4px 0;
  }
  header.top .corner{position:absolute; width:14px; height:14px; color:var(--gold-light); background:var(--burgundy);}
  header.top .corner.c-a{top:-8px; left:-8px;}
  header.top .corner.c-b{top:-8px; right:-8px;}
  header.top .corner.c-d{bottom:-8px; left:-8px;}
  header.top .corner.c-e{bottom:-8px; right:-8px;}
  header.top .book-title{
    font-size:34px; line-height:1.05; color:var(--gold-light); margin-top:16px; text-wrap:balance;
  }
  header.top .orn-line{
    display:flex; align-items:center; gap:10px; max-width:260px; margin:10px auto; color:var(--gold);
  }
  header.top .orn-line:before, header.top .orn-line:after{content:""; flex:1; height:1px; background:var(--gold);}
  header.top .orn-line svg{width:11px; height:11px;}
  header.top .church-name{
    font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-light); line-height:1.6;
  }
  header.top .titles{display:flex;align-items:flex-start;gap:14px;}
  header.top h1{font-size:23px;letter-spacing:.2px;color:var(--parchment); line-height:1.15;}
  header.top h1.app-title{font-size:34px; letter-spacing:.3px; color:var(--gold-light); font-weight:700;}
  header.top .sub{font-size:12.5px;color:var(--gold-light);margin-top:5px; line-height:1.4;}
  .role-switch{
    display:flex; border:1px solid var(--gold); border-radius:999px; overflow:hidden; flex:none;
  }
  .role-switch button{
    background:transparent;border:none;color:var(--parchment);
    font-family:"Source Sans 3",sans-serif; font-size:13px; padding:6px 14px; cursor:pointer;
  }
  .role-switch button.active{background:var(--gold); color:var(--midnight); font-weight:600;}
  .info-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--gold);
    background:transparent; color:var(--parchment); font-family:"Cormorant Garamond",serif;
    font-style:italic; font-weight:700; font-size:15px; cursor:pointer;
    align-items:center; justify-content:center;
  }
  .info-btn:hover{background:var(--gold); color:var(--midnight);}
  header.top .top-row{display:flex; flex-direction:column; gap:14px;}
  header.top .controls-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px;}
  .logout-link{
    display:inline-block; font-size:12px; color:var(--gold-light);
    text-decoration:underline; cursor:pointer; white-space:nowrap;
  }


  /* Startseite (Hauptmenü): der Rahmen füllt die ganze Seite */
  header.top.landing{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:18px 16px 24px;}
  header.top.landing .title-frame{padding:26px 16px 22px;}
  header.top.landing .crest{width:min(150px, 44vw); height:min(150px, 44vw);}
  header.top.landing .book-title{font-size:30px; margin-top:12px;}
  header.top .welcome{margin-top:20px;}
  header.top .welcome h2{font-size:25px; line-height:1.15; color:var(--gold-light); text-wrap:balance;}
  header.top .welcome p{font-size:14.5px; line-height:1.6; color:var(--parchment); margin:10px auto 0; max-width:46ch; opacity:.92;}
  header.top .tiles{display:flex; flex-direction:column; gap:12px; margin-top:22px;}
  header.top .tile{
    display:flex; align-items:center; gap:16px; text-align:left; width:100%;
    background:rgba(255,255,255,.06); border:1px solid var(--gold); color:var(--parchment);
    padding:16px 16px; cursor:pointer; font-family:"Source Sans 3",sans-serif;
    transition:background .15s ease, transform .15s ease;
  }
  header.top .tile:hover, header.top .tile:focus-visible{background:rgba(217,189,132,.18); outline:none;}
  header.top .tile:active{transform:scale(.99);}
  header.top .tile-icon{flex:none; width:46px; height:46px; color:var(--gold-light); display:flex; align-items:center; justify-content:center;}
  header.top .tile-icon svg{width:100%; height:100%;}
  header.top .tile-text{display:flex; flex-direction:column; gap:4px; min-width:0;}
  header.top .tile-title{font-size:23px; line-height:1.1; color:var(--gold-light); font-weight:600;}
  header.top .tile-sub{font-size:13px; color:var(--parchment); opacity:.85; line-height:1.4;}
  header.top .ctrl-row{display:flex; align-items:center; gap:12px; justify-content:center;}

  /* Kopf innerhalb der Bereiche: Logo links, Text rechts, goldene Linie */
  header.top.compact{padding:28px 16px 14px;}
  header.top .info-corner{position:absolute; top:10px; right:12px; display:flex; z-index:2;}
  header.top .compact-head{display:flex; align-items:center; justify-content:center; gap:12px; text-align:left; width:100%;}
  header.top.compact .crest{width:76px; height:76px; margin:0; flex:none;}
  header.top .compact-text{min-width:0; flex:0 1 auto; width:max-content; max-width:calc(100% - 88px);}
  header.top .compact-title{font-size:clamp(15px, 5.3vw, 26px); line-height:1.1; color:var(--gold-light); white-space:nowrap;}
  header.top .compact-line{height:1px; background:var(--gold); margin:7px 0;}
  header.top .compact-text .church-name{font-size:clamp(8px, 2.7vw, 12px); letter-spacing:.04em; text-transform:none; white-space:nowrap; line-height:1.3;}
  header.top.compact .top-row{gap:12px;}

  /* Titel des Bereichs unter dem Kopf */
  .section-title{text-align:center; margin:2px 0 18px;}
  .section-title h2{font-size:27px; line-height:1.15; color:var(--burgundy); text-wrap:balance; margin:2px 0;}
  .orn-line.dark{display:flex; align-items:center; gap:10px; max-width:220px; margin:6px auto; color:var(--gold);}
  .orn-line.dark:before,.orn-line.dark:after{content:""; flex:1; height:1px; background:var(--gold);}
  .orn-line.dark svg{width:10px; height:10px;}

  main{padding:22px 20px 60px;}

  .crumb{
    display:inline-flex; align-items:center; gap:9px; max-width:100%;
    margin:3px 3px 20px; padding:7px 15px 7px 11px; cursor:pointer;
    border:1px solid var(--gold); outline:1px solid var(--gold); outline-offset:2px;
    background:rgba(173,127,53,.07); color:var(--burgundy);
    font-family:"Cormorant Garamond",serif; font-weight:600; font-size:17px; line-height:1.2;
    transition:background .15s ease, color .15s ease;
  }
  .crumb::before{
    content:""; flex:none; width:7px; height:7px; margin-left:3px;
    border-left:2px solid var(--gold); border-bottom:2px solid var(--gold); transform:rotate(45deg);
  }
  .crumb:hover, .crumb:active{background:var(--burgundy); color:var(--gold-light);}
  .crumb:hover::before, .crumb:active::before{border-color:var(--gold-light);}

  /* Profile gate */
  .profile-gate{padding:40px 4px;}
  .profile-gate p{color:var(--muted); line-height:1.55; max-width:46ch;}
  .auth-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:6px;}
  .auth-tab{
    background:transparent; border:none; padding:10px 4px; margin-right:18px; cursor:pointer;
    font-family:"Source Sans 3",sans-serif; font-size:15px; color:var(--muted);
    border-bottom:2px solid transparent;
  }
  .auth-tab.active{color:var(--ink); border-bottom-color:var(--burgundy); font-weight:600;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .error-text{color:var(--burgundy); font-size:13px; margin-top:10px;}
  .field{margin-top:22px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); background:#fff;
    font-family:"Source Sans 3",sans-serif; font-size:15px; border-radius:4px; color:var(--ink);
  }
  .btn{
    margin-top:22px; background:var(--burgundy); color:#fff; border:none;
    padding:11px 22px; font-size:15px; border-radius:4px; cursor:pointer;
    font-family:"Source Sans 3",sans-serif; font-weight:600;
  }
  .btn:hover{background:#631B28;}
  .btn.secondary{background:transparent; color:var(--midnight); border:1px solid var(--midnight);}
  .btn.secondary:hover{background:var(--midnight); color:#fff;}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  /* Station list */
  .station-row{
    display:flex; align-items:center; gap:16px;
    padding:18px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .station-row:hover .station-title{color:var(--burgundy);}
  .station-row.locked{cursor:default; opacity:.55;}
  .station-num{
    font-family:"Cormorant Garamond",serif; font-size:28px; color:var(--gold);
    width:38px; text-align:center; flex:none;
  }
  .station-body{flex:1;}
  .station-title{font-size:19px; font-weight:600;}
  .station-meta{font-size:13px; color:var(--muted); margin-top:3px;}
  .badge{
    font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--sage);
    color:var(--sage); white-space:nowrap;
  }
  .badge.done{border-color:var(--burgundy); color:var(--burgundy); background:#F3E4E4;}
  .badge.locked{border-color:var(--muted); color:var(--muted);}

  /* Hymn list */
  .hymn-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .hymn-row:hover .hymn-title{color:var(--burgundy);}
  .check{
    width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted); flex:none;
    display:flex;align-items:center;justify-content:center; font-size:13px; color:#fff;
  }
  .check.self{border-color:var(--gold); background:var(--gold);}
  .check.cert{border-color:var(--burgundy); background:var(--burgundy);}
  .hymn-title-group{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .hymn-title{font-size:16px;}
  .hymn-tag{font-size:12px;color:var(--muted);}
  .lang-chips{display:flex; gap:4px; flex:none;}
  .lang-chip{
    width:24px; height:22px; border-radius:5px; border:1px solid var(--line);
    font-size:10px; font-weight:700; color:var(--muted);
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .lang-chip.done{background:var(--gold); color:var(--midnight); border-color:var(--gold);}
  .lang-chip.certified{box-shadow:0 0 0 2px var(--burgundy); border-color:var(--burgundy);}

  .diff-badge{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; flex:none;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .diff-badge.leicht{background:#E4EFE2; color:#3C6B34; border:1px solid #A9CBA1;}
  .diff-badge.mittel{background:#FBEBD9; color:#9A5B12; border:1px solid #E8BC85;}
  .diff-badge.schwer{background:#F5DEDF; color:#8E2A2E; border:1px solid #DDA0A2;}

  .volunt-badge{
    font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px; flex:none;
    background:#EEE8DA; color:var(--muted); border:1px solid var(--line);
  }
  .hymn-row.locked{cursor:default;}
  .hymn-row.locked:hover .hymn-title{color:inherit;}
  .hymn-row.locked .hymn-title{color:var(--muted); opacity:.65;}
  .lock-badge{
    font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:999px; flex:none;
    background:#EDEAE2; color:var(--muted); border:1px solid var(--line); white-space:nowrap;
  }
  .cert-badge{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; flex:none;
    background:var(--burgundy); color:#fff;
  }

  /* Hymn detail */
  .lang-tabs{display:flex; gap:8px; margin:18px 0 20px;}
  .lang-tab{
    padding:7px 16px; border:1px solid var(--line); border-radius:999px;
    font-size:14px; cursor:pointer; background:#fff;
  }
  .lang-tab.active{background:var(--midnight); color:#fff; border-color:var(--midnight);}

  .player{
    background:var(--midnight); color:var(--parchment); border-radius:8px;
    padding:18px; display:flex; flex-direction:column; gap:14px;
  }
  .player-row{display:flex; align-items:center; gap:16px;}
  .play-btn{
    width:46px;height:46px;border-radius:50%;background:var(--gold); border:none;
    color:var(--midnight); font-size:18px; cursor:pointer; flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .play-btn .icon-pause{display:none; align-items:center; gap:4px;}
  .play-btn .icon-pause span{width:4px; height:15px; background:var(--midnight); border-radius:1px; display:inline-block;}
  .play-btn.show-pause .icon-play{display:none;}
  .play-btn.show-pause .icon-pause{display:flex;}
  .stop-btn{
    width:46px;height:46px;border-radius:50%;background:transparent; border:1px solid var(--gold-light);
    color:var(--parchment); font-size:16px; cursor:pointer; flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .audio-note{font-size:11px; color:var(--gold-light); margin-top:8px;}
  .seek-row{display:flex; align-items:center; gap:10px;}
  .seek-time{font-size:11px; color:var(--gold-light); width:38px; flex:none;}
  .seek-time.total{text-align:right;}
  .seek-bar{flex:1; accent-color:var(--gold); cursor:pointer;}

  .text-block{
    margin-top:22px; background:var(--parchment-2); border:1px solid var(--line);
    border-radius:6px; padding:20px; font-size:19px; line-height:1.7;
    font-family:"Cormorant Garamond", serif;
  }
  .translit-line{
    margin-top:12px; font-size:15px; color:var(--muted); font-style:italic; line-height:1.5;
  }
  .translit-label{
    font-style:normal; font-weight:600; color:var(--sage); margin-right:6px; font-size:12px;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .self-learn-row{
    margin-top:24px; display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; border-top:1px dashed var(--line);
  }
  .toggle{
    width:46px; height:26px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex:none;
  }
  .toggle .knob{
    width:20px;height:20px;border-radius:50%;background:#fff; position:absolute; top:3px; left:3px;
    transition:left .15s ease;
  }
  .toggle.on{background:var(--gold);}
  .toggle.on .knob{left:23px;}

  /* Prüfer */
  .diakon-pick{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .diakon-pick:hover{color:var(--burgundy);}
  .approve-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .approve-row .info{flex:1;}
  .approve-row .info b{font-size:16px;}
  .approve-row .info span{display:block; font-size:12px; color:var(--muted); margin-top:2px;}

  /* Certificate */
  .certificate{
    border:2px solid var(--gold); border-radius:8px; padding:36px 28px; text-align:center;
    background:#fff; margin-top:20px; position:relative;
  }
  .certificate:before{
    content:""; position:absolute; inset:8px; border:1px solid var(--gold-light); border-radius:4px; pointer-events:none;
  }
  .certificate .kicker{font-size:12px; letter-spacing:.5px; color:var(--muted);}
  .certificate h2{font-size:32px; color:var(--midnight); margin-top:8px;}
  .certificate .name{font-size:24px; color:var(--burgundy); margin-top:16px; font-family:"Cormorant Garamond",serif;}
  .certificate .desc{font-size:14px; color:var(--muted); margin-top:14px; line-height:1.6;}
  .certificate .date{margin-top:20px; font-size:13px; color:var(--muted);}

  .empty{padding:40px 4px; text-align:center; color:var(--muted);}
  .empty h3{color:var(--ink); margin-bottom:8px;}
  .footnote{margin-top:40px; font-size:12px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:14px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,20,15,0.55); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--parchment); border-radius:10px; max-width:520px; width:100%;
    max-height:85vh; overflow-y:auto; padding:26px 24px; border:1px solid var(--line);
  }
  .modal-box h2{font-size:22px; margin-bottom:4px;}
  .modal-box ul{margin:10px 0 0; padding-left:20px; line-height:1.7; font-size:14px;}
  .modal-box li{margin-bottom:6px;}
  .modal-box .btn{margin-top:20px; width:100%;}

  .install-banner{
    position:fixed; left:0; right:0; bottom:0; z-index:500;
    background:var(--burgundy); color:var(--parchment);
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; padding-bottom:calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,0.25);
  }
  .install-banner-icon{width:36px; height:36px; border-radius:8px; flex:none;}
  .install-banner-text{flex:1; font-size:13px; line-height:1.4;}
  .install-banner .btn{padding:10px 16px; font-size:13px;}
  .install-banner-close{
    background:none; border:none; color:var(--parchment); opacity:0.7;
    font-size:16px; cursor:pointer; flex:none; padding:4px;
  }
  @media (min-width:640px){
    .install-banner{ left:auto; right:20px; bottom:20px; max-width:420px; border-radius:10px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="install-banner" id="installBanner" style="display:none;">
  <img class="install-banner-icon" id="installBannerIcon" src="icon-192.png" alt="" />
  <script>if(window.IST_PRUEFER_APP){document.getElementById("installBannerIcon").src="icon-pruefer-192.png";}</script>
  <div class="install-banner-text" id="installBannerText">Diese App auf deinem Handy installieren, für schnelleren Zugriff?</div>
  <button class="btn" id="installBannerBtn" style="margin:0; flex:none;">Installieren</button>
  <button class="install-banner-close" id="installBannerClose" title="Schliessen">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ---------------- Daten (Platzhalter-Inhalte) ---------------- */
const LANGS = [
  {code:"de", label:"Deutsch"},
  {code:"cop", label:"Koptisch"},
  {code:"ar", label:"Arabisch"},
];

const STATIONS = [
  {
    id:"s1", title:"Wiederkehrende Antworten",
    hymns:[
      {id:"s1h1", title:"Epi Eprosevki Estasite", difficulty:"leicht", tier:1, mandatory:true, content:{

/* ---------------- Altersstufen ----------------
   Stufe 1: bis 11 Jahre (exklusive 12)
   Stufe 2: 12 bis 19 Jahre
   Stufe 3: ab 20 Jahren
   Die Stufe eines Nutzers kann nie sinken: sie steigt entweder automatisch mit dem
   Alter (Geburtstag), oder sobald alle Pflicht-Antworten der aktuellen Stufe vom
   Prüfer bestätigt wurden (Lernfortschritt). Beides wird in state.profile.stufe
   persistiert (profiles.stufe in der Datenbank), nie neu heruntergerechnet. */
function ageStufeFromBirthdate(geburtsdatum){
  if(!geburtsdatum) return 1;
  const bd = new Date(geburtsdatum);
  if(isNaN(bd.getTime())) return 1;
  const today = new Date();
  let age = today.getFullYear() - bd.getFullYear();
  const hadBirthdayThisYear = (today.getMonth() > bd.getMonth()) ||
    (today.getMonth()===bd.getMonth() && today.getDate() >= bd.getDate());
  if(!hadBirthdayThisYear) age -= 1;
  if(age < 12) return 1;
  if(age < 20) return 2;
  return 3;
}

/* Diakone melden sich nur mit Vorname + Nachname + Passwort an. Supabase Auth
   verlangt intern trotzdem eine E-Mail-Adresse — die wird automatisch und
   unsichtbar aus Vorname+Nachname generiert, niemand muss sie je sehen oder eingeben. */
function normalizeNamePart(s){
  return (s||"").trim().toLowerCase()
    .replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]/g, "");
}
function generateInternalEmail(vorname, nachname){
  const base = normalizeNamePart(vorname) + "." + normalizeNamePart(nachname);
  const suffix = Date.now().toString(36) + Math.floor(Math.random()*10000);
  return `${base || "diakon"}.${suffix}@diakon.local`;
}

/* ---------------- Datenbank (Supabase) ---------------- */
async function loadProfile(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) { state.profile = null; return; }
  const user = session.user;
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !data){ state.profile = null; return; }
  const storedStufe = data.stufe || 1;
  const ageStufe = ageStufeFromBirthdate(data.geburtsdatum);
  let effectiveStufe = storedStufe;
  if(ageStufe > storedStufe){
    // Geburtstag seit letztem Login: automatisch hochstufen
    effectiveStufe = ageStufe;
    await sb.from("profiles").update({ stufe: effectiveStufe }).eq("id", user.id);
    state.pendingPromotion = { type: "geburtstag", stufe: effectiveStufe };
  }
  state.profile = {
    id: user.id,
    email: user.email,
    vorname: data.vorname,
    nachname: data.nachname,
    name: data.vorname + " " + data.nachname,
    onboarded: !!data.onboarded,
    geburtsdatum: data.geburtsdatum,
    land: data.land || null,
    stadt: data.stadt || null,
    stufe: effectiveStufe,
  };
}

async function markOnboarded(){
  if(!state.profile) return;
  state.profile.onboarded = true;
  await sb.from("profiles").update({ onboarded: true }).eq("id", state.profile.id);
}

async function registerAccount(vorname, nachname, password, geburtsdatum, land, stadt){
  const email = generateInternalEmail(vorname, nachname);
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error) return { error: error.message };
  const user = data.user;
  if(!user) return { error: "Registrierung fehlgeschlagen. Bitte erneut versuchen." };
  const initialStufe = ageStufeFromBirthdate(geburtsdatum);
  const { error: profileError } = await sb.from("profiles").insert({ id: user.id, vorname, nachname, email, geburtsdatum, stufe: initialStufe, land, stadt });
  if(profileError) return { error: profileError.message };
  return { error: null };
}

async function loginAccount(vorname, nachname, password){
  // Wir kennen die (unsichtbare) interne E-Mail nicht direkt — wir schlagen sie über
  // Vorname+Nachname im profiles-Eintrag nach. Bei (seltenen) gleichen Namen probieren
  // wir alle Treffer durch, bis Passwort und Name zusammenpassen.
  const { data, error: lookupError } = await sb.from("profiles")
    .select("email")
    .ilike("vorname", vorname)
    .ilike("nachname", nachname);
  if(lookupError || !data || data.length===0){
    return { error: "Kein Konto mit diesem Namen gefunden." };
  }
  let lastError = "Name oder Passwort ist falsch.";
  for(const row of data){
    if(!row.email) continue;
    const { error } = await sb.auth.signInWithPassword({ email: row.email, password });
    if(!error) return { error: null };
    lastError = error.message;
  }
  return { error: lastError };
}

async function logoutAccount(){
  await sb.auth.signOut();
  state.view = "menu";
  state.profile = null;
  state.progress = {};
  state.certified = {};
}

    data.forEach(row => {

/* ---------------- Theorie ----------------
   Die Texte sind noch Platzhalter. Zum Befüllen einfach bei "text" den echten Text eintragen
   (Absätze mit einer Leerzeile trennen). Die "id" nie ändern, sonst geht der Fortschritt verloren. */
const THEORIE = [
  { id: "theorie-liturgien", title: "Die verschiedenen Liturgien", text: "" },
  { id: "theorie-aufbau",    title: "Der Aufbau einer Liturgie",   text: "" },
  { id: "theorie-aufgaben",  title: "Die Aufgaben eines Diakons",  text: "" },
];
const THEORIE_INFO_KEY = "_theorie_info"; // Merker "Hinweis schon gesehen", wird wie ein Fortschrittseintrag gespeichert
function theorieGelernt(id){ return !!(state.progress[id] && state.progress[id].de); }
function theorieGelerntCount(){ return THEORIE.filter(k => theorieGelernt(k.id)).length; }
function theorieInfoGesehen(){ return !!(state.progress[THEORIE_INFO_KEY] && state.progress[THEORIE_INFO_KEY].de); }

/* ---------------- Hilfsfunktionen ---------------- */
function findStation(id){ return STATIONS.find(s=>s.id===id); }
function findHymn(id){ for(const s of STATIONS){ const h=s.hymns.find(h=>h.id===id); if(h) return {hymn:h, station:s}; } }
function hymnLangCodes(hymn){ return LANGS.filter(l => hymn.content[l.code]).map(l=>l.code); }
function langsLearnedFor(progressObj, hymnId){
  const rec = (progressObj||{})[hymnId] || {};
  return LANGS.filter(l => rec[l.code]).map(l=>l.code);
}
/* ---------------- Stufen-bewusste Antworten-Auswahl ----------------
   Jede Antwort hat ein "tier" (1/2/3): die Stufe, ab der sie überhaupt sichtbar/
   anklickbar ("entsperrt") wird. Stufe 2 sieht also Stufe 1+2 entsperrt, Stufe 3
   sieht alles entsperrt. "mandatory" entscheidet, ob eine entsperrte Antwort für
   diese Person Pflicht ist oder freiwillig (freiwillige Antworten sind bei allen
   Stufen in der Liste vorhanden, aber erst ab ihrer Stufe anklickbar). */
function hymnUnlocked(hymn, stufe){ return hymn.tier <= stufe; }
function mandatoryHymns(station, stufe){ return station.hymns.filter(h => hymnUnlocked(h, stufe) && h.mandatory!==false); }
function voluntaryHymns(station, stufe){ return station.hymns.filter(h => hymnUnlocked(h, stufe) && h.mandatory===false); }
function lockedHymns(station, stufe){ return station.hymns.filter(h => !hymnUnlocked(h, stufe)); }
function stationSelfDoneCount(station, stufe){
  // Anzahl Pflicht-Antworten, die in mindestens einer Sprache als geübt markiert sind
  return mandatoryHymns(station, stufe).filter(h => langsLearnedFor(state.progress, h.id).length > 0).length;
}
function stationVoluntSelfDoneCount(station, stufe){
  // Anzahl freiwilliger Antworten, die in mindestens einer Sprache als geübt markiert sind
  return voluntaryHymns(station, stufe).filter(h => langsLearnedFor(state.progress, h.id).length > 0).length;
}
function certifiedLangsFor(hymnId){
  return Object.keys(state.certified[hymnId] || {});
}
function isHymnLangCertified(hymnId, lang){ return !!(state.certified[hymnId] && state.certified[hymnId][lang]); }
function isHymnCertifiedAnyLang(hymnId){ return certifiedLangsFor(hymnId).length > 0; }
function isHymnFullyCertified(hymn){
  const needed = hymnLangCodes(hymn);
  const have = certifiedLangsFor(hymn.id);
  return needed.length>0 && needed.every(l => have.includes(l));
}
function allMandatoryCertified(stufe){
  // Zertifikat: pro (entsperrter) Pflicht-Antwort reicht mindestens eine bestätigte Sprache
  return STATIONS.every(s => mandatoryHymns(s, stufe).every(h => isHymnCertifiedAnyLang(h.id)));
}
function allHymnsCertified(stufe){
  // Belohnung: jede entsperrte Antwort (Pflicht + freiwillig) muss in ALLEN ihren Sprachen bestätigt sein
  return STATIONS.every(s => s.hymns.filter(h => hymnUnlocked(h, stufe)).every(h => isHymnFullyCertified(h)));
}
function stationCertifiedCount(station, stufe){
  const mand = mandatoryHymns(station, stufe);
  return mand.filter(h => isHymnCertifiedAnyLang(h.id)).length;
}
function stationVoluntCertifiedCount(station, stufe){
  const volunt = voluntaryHymns(station, stufe);
  return volunt.filter(h => isHymnCertifiedAnyLang(h.id)).length;
}
function tierFullyCertified(tier){
  // Für den Stufen-Aufstieg: sind ALLE Pflicht-Antworten GENAU dieser Stufe (nicht kumulativ) bestätigt?
  return STATIONS.every(s => s.hymns.filter(h => h.tier===tier && h.mandatory!==false).every(h => isHymnCertifiedAnyLang(h.id)));
}
async function checkLernfortschrittPromotion(){
  // Wird nach jedem Laden der Zertifizierungen aufgerufen: hat der Diakon seit dem letzten
  // Mal alle Pflicht-Antworten SEINER aktuellen Stufe vom Prüfer bestätigt bekommen? Dann
  // steigt er automatisch in die nächste Stufe auf (unabhängig vom Geburtsdatum).
  if(!state.profile || state.profile.stufe >= 3) return;
  if(tierFullyCertified(state.profile.stufe)){
    const newStufe = state.profile.stufe + 1;
    await sb.from("profiles").update({ stufe: newStufe }).eq("id", state.profile.id);
    const abgeschlosseneStufe = state.profile.stufe;
    state.profile.stufe = newStufe;
    if(!state.pendingPromotion){
      state.pendingPromotion = { type: "lernfortschritt", stufe: newStufe, abgeschlosseneStufe };
    }
  }
}

/* placeholder "audio": kurzer Ton per Web Audio API, nur falls keine echte Aufnahme existiert */
let audioCtx = null;
function playPlaceholderTone(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const dur = 1.1;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(392, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(330, audioCtx.currentTime+dur);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime+0.05);
    gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+dur+0.05);
  }catch(e){}
}

/* Echte Aufnahme aus Supabase Storage (Bucket "audio").
   Erwartetes Dateischema: {hymnId}-{lang}.mp4 ODER {hymnId}-{lang}.mp3 ODER {hymnId}-{lang}.m4a,
   z. B. s1h2-de.mp4 / s1h2-de.mp3 / s1h2-de.m4a
   Es werden die Formate der Reihe nach durchprobiert, damit sie gemischt abgelegt werden können. */
let currentAudioEl = null;
let currentAudioSourceNode = null;
let currentAudioKey = null; // merkt sich, zu welcher Antwort+Sprache die aktuell geladene Aufnahme gehört
const AUDIO_EXTENSIONS = ["mp4", "mp3", "m4a"];
function getAudioUrl(hymnId, lang, ext){
  return `${SUPABASE_URL}/storage/v1/object/public/Audios/${hymnId}-${lang}.${ext}`;
}

/* ---- "Kirchenraum"-Hall (Reverb) ----
   Legt einen künstlichen Nachhall über jede echte Aufnahme, damit sie klingt,
   als wäre sie in einem großen, hallenden Kirchenraum gesungen worden
   (typisch für koptisch-orthodoxe Hymnen).
   Zum Anpassen einfach die drei Werte unten ändern:
   - REVERB_ROOM_SECONDS: wie lange der Hall nachklingt (größerer Raum = mehr Sekunden)
   - REVERB_DECAY: wie schnell der Hall abklingt (kleinerer Wert = "hallt länger nach")
   - REVERB_WET_MIX: wie stark der Hall im Verhältnis zum Originalton ist (0 = kein Hall, 1 = nur Hall) */
const REVERB_ROOM_SECONDS = 3.2;
const REVERB_DECAY = 2.6;
const REVERB_WET_MIX = 0.42;

let reverbConvolver = null, reverbDryGain = null, reverbWetGain = null, reverbOutGain = null;

function createChurchImpulseResponse(ctx){
  const rate = ctx.sampleRate;
  const length = Math.floor(rate * REVERB_ROOM_SECONDS);
  const impulse = ctx.createBuffer(2, length, rate);
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0; i<length; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, REVERB_DECAY);
    }
  }
  return impulse;
}

function ensureReverbGraph(){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if(!reverbConvolver){
    reverbConvolver = audioCtx.createConvolver();
    reverbConvolver.buffer = createChurchImpulseResponse(audioCtx);
    reverbDryGain = audioCtx.createGain();
    reverbWetGain = audioCtx.createGain();
    reverbOutGain = audioCtx.createGain();
    reverbDryGain.gain.value = 1 - REVERB_WET_MIX;
    reverbWetGain.gain.value = REVERB_WET_MIX;
    reverbOutGain.gain.value = 1;
    reverbDryGain.connect(reverbOutGain);
    reverbConvolver.connect(reverbWetGain).connect(reverbOutGain);
    reverbOutGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

/* Beendet die aktuelle Wiedergabe vollständig (Stopp-Button ODER Verlassen der Seite —
   das Audio soll NIE im Hintergrund weiterlaufen, wenn man zu einer anderen Ansicht wechselt). */
function stopHymnAudio(){
  if(currentAudioEl){ try{ currentAudioEl.pause(); }catch(e){} }
  if(currentAudioSourceNode){ try{ currentAudioSourceNode.disconnect(); }catch(e){} }
  currentAudioEl = null;
  currentAudioSourceNode = null;
  currentAudioKey = null;
}

/* callbacks: {onStatus(status), onTime(currentTime, duration)} */
function playHymnAudio(hymnId, lang, callbacks){
  stopHymnAudio();
  const key = hymnId + "_" + lang;
  currentAudioKey = key;
  callbacks.onStatus("loading");
  const tryExt = (extIndex)=>{
    if(extIndex >= AUDIO_EXTENSIONS.length){
      callbacks.onStatus("missing");
      playPlaceholderTone();
      return;
    }
    const url = getAudioUrl(hymnId, lang, AUDIO_EXTENSIONS[extIndex]);
    const audioEl = new Audio(url);
    audioEl.crossOrigin = "anonymous"; // nötig, damit der Hall-Effekt auf die Aufnahme angewendet werden kann
    audioEl.preload = "auto";
    currentAudioEl = audioEl;
    // Browser lösen bei einer fehlenden/fehlerhaften Datei oft GLEICHZEITIG sowohl das
    // "error"-Event als auch eine abgelehnte play()-Anfrage aus. Ohne diese Sperre würde
    // dadurch der nächste Dateityp zweimal gestartet werden — man hätte die Aufnahme
    // doppelt (überlagert) gehört. Diese Sperre stellt sicher, dass pro Versuch nur
    // genau EINMAL zum nächsten Format gewechselt wird.
    let fallbackAusgeloest = false;
    const zumNaechstenFormatWechseln = ()=>{
      if(fallbackAusgeloest) return;
      fallbackAusgeloest = true;
      tryExt(extIndex+1);
    };
    audioEl.addEventListener("canplay", ()=>{
      try{
        const ctx = ensureReverbGraph();
        if(ctx.state === "suspended") ctx.resume();
        const source = ctx.createMediaElementSource(audioEl);
        currentAudioSourceNode = source;
        source.connect(reverbDryGain);
        source.connect(reverbConvolver);
      }catch(e){
        // Falls der Hall (z. B. wegen fehlender CORS-Freigabe im Storage) nicht angewendet werden kann,
        // spielt die Aufnahme trotzdem ganz normal ohne Effekt weiter.
      }
      callbacks.onStatus("playing");
    });
    audioEl.addEventListener("timeupdate", ()=>{
      if(currentAudioEl === audioEl) callbacks.onTime(audioEl.currentTime, audioEl.duration || 0);
    });
    audioEl.addEventListener("loadedmetadata", ()=>{
      if(currentAudioEl === audioEl) callbacks.onTime(audioEl.currentTime, audioEl.duration || 0);
    });
    audioEl.addEventListener("play", ()=>{
      if(currentAudioEl === audioEl) callbacks.onStatus("playing");
    });
    audioEl.addEventListener("pause", ()=>{
      if(currentAudioEl === audioEl && !audioEl.ended) callbacks.onStatus("paused");
    });
    audioEl.addEventListener("ended", ()=> callbacks.onStatus("idle"));
    audioEl.addEventListener("error", zumNaechstenFormatWechseln);
    audioEl.play().catch(zumNaechstenFormatWechseln);
  };
  tryExt(0);
}

/* ---------------- Rendering ---------------- */
const root = document.getElementById("app");

function render(){
  // Die Aufnahme darf nie im Hintergrund weiterlaufen: sobald die Hymnen-Seite verlassen
  // wird (oder auf eine andere Sprache derselben Antwort gewechselt wird), wird sie gestoppt.
  const erwarteterAudioKey = state.view==="hymn" ? (state.currentHymnId + "_" + state.currentLang) : null;
  if(currentAudioKey !== null && currentAudioKey !== erwarteterAudioKey){
    stopHymnAudio();
  }
  root.innerHTML = "";
  root.appendChild(renderHeader());
  const main = document.createElement("main");
  main.appendChild(renderBody());
  if(!(state.role==="diakon" && state.profile && state.view==="menu")) root.appendChild(main);

  if(state.role==="diakon" && state.profile && state.pendingPromotion){
    root.appendChild(renderPromotionModal());
  } else if(state.role==="diakon" && state.profile && ((state.view==="home" && !state.profile.onboarded) || state.showOnboardingManually)){
    root.appendChild(renderOnboardingModal());
  } else if(state.role==="diakon" && state.profile && ((state.view==="theorie" && !theorieInfoGesehen()) || state.showTheorieInfo)){
    root.appendChild(renderTheorieModal());
  }
}

      <h2 class="serif">🎉 Stufe ${p.abgeschlosseneStufe} abgeschlossen!</h2>

      <p style="color:var(--muted); font-size:13px; margin-top:10px;">Denk daran: Eine Antwort deiner Stufe darfst du in der Liturgie erst vorsingen, sobald du die <strong>ganze Stufe</strong> gelernt hast — nicht schon, sobald du eine einzelne Antwort kannst.</p>

  box.querySelector("#theorieOk").addEventListener("click", async ()=>{
    state.showTheorieInfo = false;
    if(firstTime) await setProgress(THEORIE_INFO_KEY, "de", true);

  return overlay;
}

function isDiakonSection(){ return ["home","station","hymn","stufenzertifikat"].includes(state.view); }

/* Prüfer melden sich nur ab (zurück zum Passwort). Einen Wechsel zur Diakon-Ansicht gibt es nicht: dafür gibt es die zwei getrennten Apps/Links. */
function prueferAbmelden(){
  state.prueferAuthenticated=false; state.prueferPasswordOk=false; state.prueferPasswordInput=""; state.prueferName=""; state.prueferLand=null; state.prueferStadt=null;
  state.role = "pruefer"; state.view = "pruefer-home"; state.authError = ""; state.prueferError = "";
  render();
}
/* Der Prüfer-Bereich ist nur über den eigenen Link (…/#pruefer) erreichbar, nicht über einen Schalter. */
async function pruefeUrlHash(){
  if(location.hash === "#pruefer" || window.IST_PRUEFER_APP){
    state.role = "pruefer"; state.view = "pruefer-home"; state.authError = "";
    if(state.prueferAuthenticated) state.allDiakone = await loadAllDiakone();
  } else if(state.role === "pruefer"){
    state.role = "diakon"; state.view = "menu";
  }
}
window.addEventListener("hashchange", async ()=>{ await pruefeUrlHash(); render(); });

  if(tA) tA.addEventListener("click", ()=>{ state.view = "home"; render(); window.scrollTo(0,0); });

function renderBody(){
  if(state.role==="pruefer"){
    if(!state.prueferAuthenticated) return renderPrueferGate();
    if(state.view==="pruefer-station") return renderPrueferStation();
    return renderPrueferHome();
  }
  if(!state.profile){
    return renderDiakonAuthGate();
  }
  if(state.view==="menu") return document.createElement("div");
  if(state.view==="theorie") return renderTheorie();
  if(state.view==="theorie-kapitel") return renderTheorieKapitel();

  if(state.view==="station") return renderStation();
  if(state.view==="stufenzertifikat") return renderStufenZertifikat();
  return renderHome();
}

function renderPrueferGate(){
  const wrap = document.createElement("div");
  wrap.className = "profile-gate";

  if(!state.prueferPasswordOk){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Prüfer-Bereich</h2>
      <p>Dieser Bereich ist nur für Verantwortliche, die Antworten bestätigen dürfen. Bitte Passwort eingeben.</p>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="prueferPw" placeholder="Passwort" />
      </div>
      <button class="btn" id="prueferGoBtn">Weiter</button>
      ${state.prueferError ? `<div class="error-text">${state.prueferError}</div>` : ""}
    `;
    const pwInput = wrap.querySelector("#prueferPw");
    pwInput.value = state.prueferPasswordInput;
    const submit = ()=>{
      if(pwInput.value === PRUEFER_PASSWORD){
        state.prueferPasswordOk = true;
        state.prueferError = "";
      } else {
        state.prueferError = "Falsches Passwort.";
        state.prueferPasswordInput = pwInput.value;
      }
      render();
    };
    wrap.querySelector("#prueferGoBtn").addEventListener("click", submit);
    pwInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
    return wrap;
  }

  // Schritt 2: Land
  if(!state.prueferLand){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Welches Land?</h2>
      <p>Du siehst danach nur die Diakone der gewählten Stadt.</p>
      <div id="landBtns">${LAENDER.map(l=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-land="${l.name}">${l.name}</button>`).join("")}</div>
    `;
    wrap.querySelectorAll("#landBtns button").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.prueferLand = btn.dataset.land; render(); });
    });
    return wrap;
  }

  // Schritt 3: Stadt
  if(!state.prueferStadt){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Welche Stadt?</h2>
      <p>${state.prueferLand}</p>
      <div id="stadtBtns">${staedteVon(state.prueferLand).map(s=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-stadt="${s}">${s}</button>`).join("")}</div>
      <div class="crumb" id="landZurueck" style="margin-top:22px;">Land ändern</div>
    `;
    wrap.querySelectorAll("#stadtBtns button").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.prueferStadt = btn.dataset.stadt; render(); });
    });
    wrap.querySelector("#landZurueck").addEventListener("click", ()=>{ state.prueferLand = null; render(); });
    return wrap;
  }

  // Schritt 4: Wer bist du?
  const namen = PRUEFER_NAMEN_FUER(state.prueferStadt);
  const weiter = async (name)=>{
    state.prueferName = name;
    state.prueferAuthenticated = true;
    state.view = "pruefer-home";
    state.allDiakone = await loadAllDiakone();
    render();
    maybeShowInstallBanner();
  };
  if(namen.length){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Wer bestätigt gerade?</h2>
      <p>${state.prueferStadt}: Wähle deinen Namen, damit Bestätigungen zugeordnet werden können.</p>
      <div id="nameBtns">${namen.map(n=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-name="${n}">${n}</button>`).join("")}</div>
      <div class="crumb" id="stadtZurueck" style="margin-top:22px;">Stadt ändern</div>
    `;
    wrap.querySelectorAll("#nameBtns button").forEach(btn=>{
      btn.addEventListener("click", ()=>weiter(btn.dataset.name));
    });
  } else {
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Wer bestätigt gerade?</h2>
      <p>${state.prueferStadt}: Gib deinen Namen ein, damit Bestätigungen zugeordnet werden können.</p>
      <div class="field"><label>Dein Name</label><input type="text" id="prueferNameInput" placeholder="Vorname Nachname" /></div>
      <button class="btn" id="prueferNameGo">Weiter</button>
      <div class="crumb" id="stadtZurueck" style="margin-top:22px;">Stadt ändern</div>
    `;
    const go = ()=>{ const v = wrap.querySelector("#prueferNameInput").value.trim(); if(v) weiter(v); };
    wrap.querySelector("#prueferNameGo").addEventListener("click", go);
    wrap.querySelector("#prueferNameInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") go(); });
  }
  wrap.querySelector("#stadtZurueck").addEventListener("click", ()=>{ state.prueferStadt = null; render(); });
  return wrap;
}

function renderDiakonAuthGate(){
  const wrap = document.createElement("div");
  wrap.className = "profile-gate";

  const header = document.createElement("div");
  header.innerHTML = `<h2 class="serif" style="font-size:26px;">Willkommen</h2>
    <p>Melde dich an oder registriere dich, um deinen persönlichen Lernfortschritt zu speichern.</p>`;
  wrap.appendChild(header);

  const tabs = document.createElement("div");
  tabs.className = "auth-tabs";
  tabs.innerHTML = `
    <button class="auth-tab ${state.authTab==='login'?'active':''}" data-tab="login">Anmelden</button>
    <button class="auth-tab ${state.authTab==='register'?'active':''}" data-tab="register">Registrieren</button>
  `;
  tabs.addEventListener("click",(e)=>{
    const b = e.target.closest("button"); if(!b) return;
    state.authTab = b.dataset.tab; state.authError = "";
    render();
  });
  wrap.appendChild(tabs);

  const form = document.createElement("div");

  if(state.authTab === "register"){
    form.innerHTML = `
      <div class="field-row">
        <div class="field"><label>Vorname</label><input type="text" id="regVorname" /></div>
        <div class="field"><label>Nachname</label><input type="text" id="regNachname" /></div>
      </div>
      <div class="field"><label>Geburtsdatum</label><input type="date" id="regGeburtsdatum" /></div>
      <div class="field-row">
        <div class="field"><label>Land</label>
          <select id="regLand"><option value="">Bitte wählen</option>${LAENDER.map(l=>`<option value="${l.name}">${l.name}</option>`).join("")}</select></div>
        <div class="field"><label>Stadt</label>
          <select id="regStadt" disabled><option value="">Zuerst Land wählen</option></select></div>
      </div>
      <div class="field"><label>Passwort</label><input type="password" id="regPassword" /></div>
      <button class="btn" id="regBtn">Registrieren</button>
      ${state.authError ? `<div class="error-text">${state.authError}</div>` : ""}
    `;
    wrap.appendChild(form);
    const regLand = wrap.querySelector("#regLand");
    const regStadt = wrap.querySelector("#regStadt");
    regLand.addEventListener("change", ()=>{
      const st = staedteVon(regLand.value);
      regStadt.innerHTML = st.length
        ? `<option value="">Bitte wählen</option>` + st.map(s=>`<option value="${s}">${s}</option>`).join("")
        : `<option value="">Zuerst Land wählen</option>`;
      regStadt.disabled = st.length===0;
    });
    const regBtn = wrap.querySelector("#regBtn");
    regBtn.addEventListener("click", async ()=>{
      const vorname = wrap.querySelector("#regVorname").value.trim();
      const nachname = wrap.querySelector("#regNachname").value.trim();
      const geburtsdatum = wrap.querySelector("#regGeburtsdatum").value;
      const password = wrap.querySelector("#regPassword").value;
      const land = regLand.value;
      const stadt = regStadt.value;
      if(!vorname || !nachname || !geburtsdatum || !password || !land || !stadt){
        state.authError = "Bitte alle Felder ausfüllen."; render(); return;
      }
      if(password.length < 6){
        state.authError = "Das Passwort muss mindestens 6 Zeichen haben."; render(); return;
      }
      regBtn.disabled = true; regBtn.textContent = "Registriere …";
      const result = await registerAccount(vorname, nachname, password, geburtsdatum, land, stadt);
      if(result.error){
        state.authError = result.error; render(); return;
      }
      await loadProfile();
      await loadProgress();
      state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
      state.authError = "";
      render();
      maybeShowInstallBanner();
    });
  } else {
    form.innerHTML = `
      <div class="field-row">
        <div class="field"><label>Vorname</label><input type="text" id="loginVorname" /></div>
        <div class="field"><label>Nachname</label><input type="text" id="loginNachname" /></div>
      </div>
      <div class="field"><label>Passwort</label><input type="password" id="loginPassword" /></div>
      <button class="btn" id="loginBtn">Anmelden</button>
      ${state.authError ? `<div class="error-text">${state.authError}</div>` : ""}
    `;
    wrap.appendChild(form);
    const loginBtn = wrap.querySelector("#loginBtn");
    loginBtn.addEventListener("click", async ()=>{
      const vorname = wrap.querySelector("#loginVorname").value.trim();
      const nachname = wrap.querySelector("#loginNachname").value.trim();
      const password = wrap.querySelector("#loginPassword").value;
      if(!vorname || !nachname || !password){
        state.authError = "Bitte Vorname, Nachname und Passwort eingeben."; render(); return;
      }
      loginBtn.disabled = true; loginBtn.textContent = "Melde an …";
      const result = await loginAccount(vorname, nachname, password);
      if(result.error){
        state.authError = "Name oder Passwort ist falsch."; render(); return;
      }
      await loadProfile();
      await loadProgress();
      state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
      state.authError = "";
      render();
      maybeShowInstallBanner();
    });
  }

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = "Deine Anmeldedaten werden sicher über Supabase verwaltet.";
  wrap.appendChild(note);

  return wrap;
}

function renderHome(){
  const wrap = document.createElement("div");
  const stufe = state.profile.stufe;
  const rewardDone = allHymnsCertified(stufe);
  const hauptCrumb = document.createElement("div");
  hauptCrumb.className = "crumb";
  hauptCrumb.textContent = "Hauptmenü";
  hauptCrumb.addEventListener("click", ()=>{ state.view="menu"; render(); });
  wrap.appendChild(hauptCrumb);
  wrap.appendChild(sectionTitle("Lernprogramm"));
  const intro = document.createElement("div");
  intro.innerHTML = `<h2 class="serif" style="font-size:24px;">Hallo ${state.profile.name}</h2>
    <p style="color:var(--muted); margin-top:6px; font-size:14px;">Übe die Antworten in deinem eigenen Tempo. Wenn du bereit bist, geh zum Prüfer in der Kirche und sing sie vor — er bestätigt sie dann direkt hier in der App.</p>`;
  wrap.appendChild(intro);

  if(rewardDone){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:18px; padding:14px 16px; background:#FBEBD9; border:1px solid var(--gold); border-radius:6px;";
    banner.innerHTML = `<span style="font-size:14px;">🏅 Du hast wirklich <strong>alle</strong> Antworten (Pflicht + freiwillig) bestätigt bekommen — besonders gut gemacht!</span>`;
    wrap.appendChild(banner);
  }
  // Zertifikat: nur die jeweils höchste abgeschlossene Stufe wird gezeigt —
  // das Zertifikat der nächsten Stufe ersetzt das der vorherigen.
  const hoechsteAbgeschlosseneStufe = [3,2,1].find(t => tierFullyCertified(t));
  if(hoechsteAbgeschlosseneStufe){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:18px; padding:14px 16px; background:#F3E4E4; border:1px solid var(--burgundy); border-radius:6px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;";
    banner.innerHTML = `<span style="font-size:14px;">Alle Pflicht-Antworten der Stufe ${hoechsteAbgeschlosseneStufe} bestätigt — dein Zertifikat ist bereit.</span>`;
    const btn = document.createElement("button");
    btn.className = "btn"; btn.style.margin="0"; btn.textContent = `Stufe ${hoechsteAbgeschlosseneStufe}-Zertifikat ansehen`;
    btn.addEventListener("click", ()=>{ state.stufenZertifikatStufe = hoechsteAbgeschlosseneStufe; state.view = "stufenzertifikat"; render(); });
    banner.appendChild(btn);
    wrap.appendChild(banner);
  }

  const list = document.createElement("div");
  list.style.marginTop = "20px";
  STATIONS.forEach((s, i)=>{
    const done = stationSelfDoneCount(s, stufe);
    const certCount = stationCertifiedCount(s, stufe);
    const mandCount = mandatoryHymns(s, stufe).length;
    const voluntCount = voluntaryHymns(s, stufe).length;
    const voluntCertCount = stationVoluntCertifiedCount(s, stufe);
    const voluntDone = stationVoluntSelfDoneCount(s, stufe);
    let metaText, stationDone;
    if(stufe < 3){
      // Stufe 1 und 2 kennen keine "Pflicht/freiwillig"-Unterscheidung — jede freigeschaltete Antwort
      // dieser Stufe muss gelernt werden, daher einfach "X von Y Antworten".
      const totalCount = mandCount + voluntCount;
      const totalCert = certCount + voluntCertCount;
      const totalDone = done + voluntDone;
      if(totalCount>0){
        metaText = `${totalCert}/${totalCount} Antworten bestätigt (${totalDone} selbst geübt)`;
      } else if(s.hymns.length>0){
        const minTier = Math.min(...s.hymns.map(h=>h.tier));
        metaText = `Diese Antworten werden erst ab Stufe ${minTier} freigeschaltet.`;
      } else {
        metaText = "";
      }
      stationDone = totalCount>0 && totalCert===totalCount;
    } else {
      metaText = mandCount>0
        ? `${certCount}/${mandCount} Pflicht-Antworten bestätigt (${done} selbst geübt)` + (voluntCount>0 ? ` · ${voluntCertCount}/${voluntCount} freiwillige Antworten bestätigt (${voluntDone} selbst geübt)` : "")
        : (voluntCount>0 ? `${voluntCertCount}/${voluntCount} freiwillige Antworten bestätigt (${voluntDone} selbst geübt)` : "");
      stationDone = mandCount>0 ? certCount===mandCount : (voluntCount>0 && voluntCertCount===voluntCount);
    }
    const row = document.createElement("div");
    row.className = "station-row";
    row.innerHTML = `
      <div class="station-num">${i+1}</div>
      <div class="station-body">
        <div class="station-title">${s.title}</div>
        <div class="station-meta">${metaText}</div>
      </div>
      ${stationDone ? `<div class="badge done">Fertig</div>` : ""}
    `;
    row.addEventListener("click", ()=>{ state.currentStationId = s.id; state.view="station"; render(); });
    list.appendChild(row);
  });
  wrap.appendChild(list);

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = "Alle Antworten sind jederzeit zugänglich. Es reicht, jede Pflicht-Antwort in einer Sprache zu lernen und dem Prüfer vorzusingen — dann erhältst du dein Zertifikat. Für die besondere Belohnung müsst ihr alle Antworten (Pflicht + freiwillig) in allen verfügbaren Sprachen bestätigt bekommen.";
  wrap.appendChild(note);

  return wrap;
}

function renderStation(){
  const s = findStation(state.currentStationId);
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "Alle Stationen";
  crumb.addEventListener("click", ()=>{ state.view="home"; render(); });
  wrap.appendChild(crumb);

  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = s.title;
  wrap.appendChild(title);

  const hint = document.createElement("p");
  hint.style.cssText = "color:var(--muted); font-size:13px; margin-top:4px;";
  hint.textContent = "Die Kürzel zeigen, in welcher Sprache du eine Antwort schon geübt hast.";
  wrap.appendChild(hint);

  if(s.hymns.length===0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>Inhalte folgen bald</h3><p>Die Antworten für diese Station werden noch ergänzt.</p>`;
    wrap.appendChild(empty);
    return wrap;
  }

  const stufe = state.profile.stufe;

  list.style.marginTop = "14px";
  s.hymns.forEach(h=>{
    const unlocked = hymnUnlocked(h, stufe);
    const hymnLangs = LANGS.filter(l => h.content[l.code]);
    const row = document.createElement("div");

    if(!unlocked){
      row.className = "hymn-row locked";
      row.innerHTML = `
        <div class="hymn-title-group">
          <span class="hymn-title">${h.title}</span>
          <div class="lock-badge">🔒 ab Stufe ${h.tier}</div>
        </div>
      `;
      list.appendChild(row);
      return;
    }

    const learnedLangs = langsLearnedFor(state.progress, h.id);
    row.className = "hymn-row";
    const chips = hymnLangs.map(l=>{
      const done = learnedLangs.includes(l.code);
      const cert = isHymnLangCertified(h.id, l.code);
      const abbr = l.code==="de"?"DE":(l.code==="cop"?"KO":"AR");
      const cls = [done?'done':'', cert?'certified':''].filter(Boolean).join(' ');
      const titleTxt = l.label + (cert ? " — vom Prüfer bestätigt" : (done ? " — selbst geübt" : ""));
      return `<div class="lang-chip ${cls}" title="${titleTxt}">${abbr}</div>`;
    }).join("");
    const diffBadge = h.difficulty ? `<div class="diff-badge ${h.difficulty}">${h.difficulty}</div>` : "";
    const voluntBadge = h.mandatory===false ? `<div class="volunt-badge">freiwillig</div>` : "";
    row.innerHTML = `
      <div class="hymn-title-group">
        <span class="hymn-title">${h.title}</span>
        ${diffBadge}
        ${voluntBadge}
      </div>
      <div class="lang-chips">${chips}</div>
    `;
    row.addEventListener("click", ()=>{
      state.currentHymnId = h.id;
      state.currentLang = hymnLangs[0].code;
      state.view = "hymn";
      render();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderHymn(){
  const {hymn, station} = findHymn(state.currentHymnId);
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "" + station.title;
  crumb.addEventListener("click", ()=>{ state.view="station"; render(); });
  wrap.appendChild(crumb);

  if(!hymnUnlocked(hymn, state.profile.stufe)){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>Noch gesperrt</h3><p>Diese Antwort gehört zu Stufe ${hymn.tier} — sie wird freigeschaltet, sobald du diese Stufe erreichst.</p>`;
    wrap.appendChild(empty);
    return wrap;
  }

  const titleRow = document.createElement("div");
  titleRow.style.cssText = "display:flex; align-items:center; gap:10px; flex-wrap:wrap;";
  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = hymn.title;
  titleRow.appendChild(title);
  if(hymn.difficulty){
    const diffSpan = document.createElement("span");
    diffSpan.className = "diff-badge " + hymn.difficulty;
    diffSpan.textContent = hymn.difficulty;
    titleRow.appendChild(diffSpan);
  }
  if(hymn.mandatory===false){
    const voluntSpan = document.createElement("span");
    voluntSpan.className = "volunt-badge";
    voluntSpan.textContent = "freiwillig";
    titleRow.appendChild(voluntSpan);
  }
  wrap.appendChild(titleRow);

  const hymnLangs = LANGS.filter(l => hymn.content[l.code]);
  if(!hymn.content[state.currentLang]) state.currentLang = hymnLangs[0].code;

  const tabs = document.createElement("div");
  tabs.className = "lang-tabs";
  hymnLangs.forEach(l=>{
    const b = document.createElement("button");
    b.className = "lang-tab" + (state.currentLang===l.code? " active":"");
    b.textContent = l.label;
    b.addEventListener("click", ()=>{ state.currentLang=l.code; render(); });
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);
  if(hymnLangs.length < LANGS.length){
    const note = document.createElement("p");
    note.style.cssText = "color:var(--muted); font-size:12px; margin-top:-14px; margin-bottom:18px;";
    note.textContent = "Diese Antwort wird bei uns nur in " + hymnLangs.map(l=>l.label).join(" und ") + " gesungen.";
    wrap.appendChild(note);
  }

  const content = hymn.content[state.currentLang];

  const player = document.createElement("div");
  player.className = "player";
  player.innerHTML = `
    <div class="player-row">
      <button class="play-btn" id="playBtn"><span class="icon-play">▶</span><span class="icon-pause"><span></span><span></span></span></button>
      <button class="stop-btn" id="stopBtn" title="Stopp">■</button>
      <div>
        <div style="font-weight:600;">Aufnahme anhören</div>
        <div class="audio-note" id="audioStatus">Bereit</div>
      </div>
    </div>
    <div class="seek-row">
      <span class="seek-time" id="seekCurrent">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" />
      <span class="seek-time total" id="seekTotal">0:00</span>
    </div>
  `;
  const statusEl = player.querySelector("#audioStatus");
  const playBtn = player.querySelector("#playBtn");
  const stopBtn = player.querySelector("#stopBtn");
  const seekBar = player.querySelector("#seekBar");
  const seekCurrentEl = player.querySelector("#seekCurrent");
  const seekTotalEl = player.querySelector("#seekTotal");
  const formatTime = (t)=>{
    if(!isFinite(t) || t<0) t = 0;
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ":" + (s<10? "0":"") + s;
  };
  let userIsSeeking = false;
  const thisKey = hymn.id + "_" + state.currentLang;
  const setStatus = (s)=>{
    if(s==="loading"){ statusEl.textContent = "Lädt …"; playBtn.classList.remove("show-pause"); }
    else if(s==="playing"){ statusEl.textContent = "Spielt ab …"; playBtn.classList.add("show-pause"); }
    else if(s==="paused"){ statusEl.textContent = "Pausiert"; playBtn.classList.remove("show-pause"); }
    else if(s==="missing"){ statusEl.textContent = "Keine Aufnahme für diese Sprache hinterlegt (Platzhalter-Ton)"; playBtn.classList.remove("show-pause"); }
    else { statusEl.textContent = "Bereit"; playBtn.classList.remove("show-pause"); }
  };
  const setTime = (cur, dur)=>{
    if(userIsSeeking) return;
    seekCurrentEl.textContent = formatTime(cur);
    seekTotalEl.textContent = formatTime(dur);
    seekBar.value = dur>0 ? Math.round((cur/dur)*1000) : 0;
  };
  // Falls dieselbe Aufnahme (gleiche Antwort + Sprache) schon läuft/pausiert ist (z. B. weil
  // der Nutzer zwischendurch nur den Selbst-geübt-Haken gesetzt hat und die Seite neu
  // gezeichnet wurde), spiegelt die Anzeige direkt deren aktuellen Zustand statt "Bereit".
  if(currentAudioKey === thisKey && currentAudioEl){
    setStatus(currentAudioEl.paused ? "paused" : "playing");
    setTime(currentAudioEl.currentTime, currentAudioEl.duration || 0);
  }
  playBtn.addEventListener("click", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl){
      if(currentAudioEl.paused) currentAudioEl.play().catch(()=>{});
      else currentAudioEl.pause();
    } else {
      playHymnAudio(hymn.id, state.currentLang, { onStatus: setStatus, onTime: setTime });
    }
  });
  stopBtn.addEventListener("click", ()=>{
    stopHymnAudio();
    setStatus("idle");
    setTime(0, 0);
  });
  seekBar.addEventListener("input", ()=>{ userIsSeeking = true; });
  seekBar.addEventListener("change", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl && isFinite(currentAudioEl.duration)){
      currentAudioEl.currentTime = (seekBar.value/1000) * currentAudioEl.duration;
    }
    userIsSeeking = false;
  });
  wrap.appendChild(player);

  const textBlock = document.createElement("div");
  textBlock.className = "text-block";
  const mainText = content.text || content.translit || "";
  if(content.html){ textBlock.innerHTML = mainText; } else { textBlock.textContent = mainText; }
  wrap.appendChild(textBlock);

  const selfRow = document.createElement("div");
  selfRow.className = "self-learn-row";
  const currentLangLabel = LANGS.find(l=>l.code===state.currentLang).label;
  const learned = !!(state.progress[hymn.id] && state.progress[hymn.id][state.currentLang]);
  selfRow.innerHTML = `
    <div>
      <div style="font-weight:600; font-size:15px;">Ich habe das auf ${currentLangLabel} geübt</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">Nur dein persönlicher Fortschritt für diese Sprache — die offizielle Bestätigung gibt der Prüfer.</div>
    </div>
    <div class="toggle ${learned?'on':''}" id="selfToggle"><div class="knob"></div></div>
  `;
  selfRow.querySelector("#selfToggle").addEventListener("click", async ()=>{
    await setProgress(hymn.id, state.currentLang, !learned);
    render();
  });
  wrap.appendChild(selfRow);

  const certInfo = document.createElement("div");
  const certForLang = isHymnLangCertified(hymn.id, state.currentLang);
  if(certForLang){
    const rec = state.certified[hymn.id][state.currentLang];
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:#F3E4E4; border:1px solid var(--burgundy); border-radius:6px; font-size:13px; color:var(--burgundy); font-weight:600;";
    certInfo.textContent = `✓ Auf ${currentLangLabel} vom Prüfer bestätigt (${rec.by}, ${rec.date}) — du kannst trotzdem jederzeit weiter üben.`;
  } else {
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--parchment-2); border:1px solid var(--line); border-radius:6px; font-size:13px; color:var(--muted);";
    certInfo.textContent = `Auf ${currentLangLabel} noch nicht vom Prüfer bestätigt. Geh zu einem Prüfer in der Kirche, um diese Antwort in dieser Sprache vorzusingen.`;
  }
  wrap.appendChild(certInfo);

  return wrap;
}

function renderStufenZertifikat(){
  const stufe = state.stufenZertifikatStufe;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "Zurück";
  crumb.addEventListener("click", ()=>{ state.view="home"; state.stufenZertifikatStufe=null; render(); });
  wrap.appendChild(crumb);

  // Alle Pflicht-Hymnen dieser Stufe einsammeln, um das letzte Bestätigungsdatum zu bestimmen
  const hymnIdsOfStufe = [];
  STATIONS.forEach(s=>{
    s.hymns.forEach(h=>{
      if(h.tier===stufe && h.mandatory!==false) hymnIdsOfStufe.push(h.id);
    });
  });
  const dates = hymnIdsOfStufe
    .map(id=>{
      const langs = certifiedLangsFor(id);
      const entries = langs.map(l=> state.certified[id] && state.certified[id][l]).filter(Boolean);
      return entries.map(e=>e.date).filter(Boolean);
    })
    .flat()
    .sort();
  const lastDate = dates.length? dates[dates.length-1] : new Date().toLocaleDateString("de-CH");

  const stufeNamen = { 1: "Stufe 1", 2: "Stufe 2", 3: "Stufe 3" };
  const stufeAlter = { 1: "unter 12 Jahren", 2: "zwischen 12 und 20 Jahren", 3: "ab 20 Jahren" };

  const cert = document.createElement("div");
  cert.className = "certificate";
  cert.innerHTML = `
    <div class="kicker">KOPTISCH-ORTHODOXE KIRCHE ZÜRICH</div>
    <h2 class="serif">Diakonenzertifikat der Stufe ${stufe}</h2>
    <div style="font-size:14px; color:var(--muted); margin-top:10px;">verliehen an</div>
    <div class="name">${state.profile.name}</div>
    <div class="desc">hat alle Pflicht-Antworten der <strong>${stufeNamen[stufe] || ("Stufe " + stufe)}</strong> (Altersgruppe ${stufeAlter[stufe] || ""}) erfolgreich vor einem Verantwortlichen der Gemeinde vorgetragen und ist damit berechtigt, diese Antworten ab sofort in der Liturgie vorzutragen.</div>
    <div class="date">Abgeschlossen am ${lastDate}</div>
  `;
  wrap.appendChild(cert);

  const printBtn = document.createElement("button");
  printBtn.className = "btn secondary";
  printBtn.style.marginTop = "18px";
  printBtn.textContent = "Drucken / als PDF speichern";
  printBtn.addEventListener("click", ()=> window.print());
  wrap.appendChild(printBtn);

  return wrap;
}

/* ---------------- Prüfer-Ansicht ---------------- */
function renderPrueferHome(){
  const wrap = document.createElement("div");
  wrap.innerHTML = `<h2 class="serif" style="font-size:24px;">Diakone in ${state.prueferStadt}</h2>
    <p style="color:var(--muted); font-size:14px; margin-top:6px;">${state.prueferLand} · Wähle einen Diakon aus, um Stationen zu bestätigen.</p>
    <div class="crumb" id="stadtWechseln" style="margin-top:14px; margin-bottom:0;">Stadt wechseln</div>`;
  wrap.querySelector("#stadtWechseln").addEventListener("click", ()=>{
    state.prueferAuthenticated = false; state.prueferName = ""; state.prueferLand = null; state.prueferStadt = null;
    state.view = "pruefer-home"; render();
  });
  const list = document.createElement("div");
  list.style.marginTop = "16px";
  if(state.allDiakone.length===0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>Noch keine Diakone registriert</h3><p>Sobald sich jemand im Diakon-Bereich registriert, erscheint er hier.</p>`;
    list.appendChild(empty);
  }
  state.allDiakone.forEach(u=>{
    const fullName = u.vorname+" "+u.nachname;
    const row = document.createElement("div");
    row.className = "diakon-pick";
    row.innerHTML = `
      <span class="diakon-open" style="flex:1; cursor:pointer;">${fullName}</span>
      <span class="diakon-open" style="color:var(--muted); font-size:13px; cursor:pointer;">öffnen →</span>
      <span class="diakon-delete" style="color:var(--burgundy); font-size:13px; text-decoration:underline; cursor:pointer; margin-left:14px; white-space:nowrap;">Löschen</span>
    `;
    row.querySelectorAll(".diakon-open").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const effectiveStufe = Math.max(u.stufe || 1, ageStufeFromBirthdate(u.geburtsdatum));
        state.pruefer_selectedDiakon = {name: fullName, id: u.id, stufe: effectiveStufe};
        state.certified = await loadCertified(u.id);
        const { data } = await sb.from("progress").select("hymn_id, lang, learned").eq("user_id", u.id);
        state.pruefer_progress = {};
        (data||[]).forEach(row=>{
          if(!state.pruefer_progress[row.hymn_id]) state.pruefer_progress[row.hymn_id] = {};
          state.pruefer_progress[row.hymn_id][row.lang] = row.learned;
        });
        state.view = "pruefer-station";
        render();
      });
    });
    row.querySelector(".diakon-delete").addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(!confirm(`"${fullName}" wirklich vollständig löschen? Profil, Fortschritt und alle Bestätigungen werden entfernt. Das kann nicht rückgängig gemacht werden.`)) return;
      await deleteDiakon(u.id);
      state.allDiakone = await loadAllDiakone();
      render();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderPrueferStation(){
  const u = state.pruefer_selectedDiakon;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "Alle Diakone";
  crumb.addEventListener("click", ()=>{ state.view="pruefer-home"; render(); });
  wrap.appendChild(crumb);

  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = u.name;
  wrap.appendChild(title);

  const sub = document.createElement("p");
  sub.style.cssText = "color:var(--muted); font-size:13px; margin-top:6px;";
  sub.textContent = "Bestätige jede Antwort einzeln, nachdem sie dir vorgesungen wurde. Angemeldet als: " + state.prueferName;
  wrap.appendChild(sub);

  if(u.stufe < 3 && tierFullyCertified(u.stufe)){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:14px; padding:12px 14px; background:#FBEBD9; border:1px solid var(--gold); border-radius:6px; font-size:13px;";
    banner.textContent = `Stufe ${u.stufe} ist vollständig bestätigt. Beim nächsten Login von ${u.name} wird automatisch Stufe ${u.stufe+1} freigeschaltet.`;
    wrap.appendChild(banner);
  }

  STATIONS.forEach((s,i)=>{
    if(s.hymns.length===0) return;
    const stationHeader = document.createElement("h3");
    stationHeader.className = "serif";
    stationHeader.style.cssText = "font-size:18px; margin-top:26px; margin-bottom:4px;";
    stationHeader.textContent = (i+1) + ". " + s.title;
    wrap.appendChild(stationHeader);

    const list = document.createElement("div");
    s.hymns.forEach(h=>{
      const unlocked = hymnUnlocked(h, u.stufe);
      const row = document.createElement("div");
      row.className = "approve-row";
      row.style.flexDirection = "column";
      row.style.alignItems = "stretch";
      row.style.gap = "10px";

      if(!unlocked){
        row.style.opacity = ".55";
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `<b>${h.title}</b> <span class="lock-badge">🔒 ab Stufe ${h.tier}</span>`;
        row.appendChild(info);
        list.appendChild(row);
        return;
      }

      const hymnLangs = LANGS.filter(l => h.content[l.code]);
      const learnedLangCodes = LANGS.filter(l => (state.pruefer_progress[h.id]||{})[l.code]).map(l=>l.code);
      const voluntTag = h.mandatory===false ? ` <span class="volunt-badge">freiwillig</span>` : "";

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<b>${h.title}${voluntTag}</b>`;
      row.appendChild(info);

      const langRow = document.createElement("div");
      langRow.style.cssText = "display:flex; flex-wrap:wrap; gap:8px;";
      hymnLangs.forEach(l=>{
        const selfDone = learnedLangCodes.includes(l.code);
        const certified = isHymnLangCertified(h.id, l.code);
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.style.margin = "0";
        btn.style.fontSize = "13px";
        btn.style.padding = "8px 12px";
        if(certified){
          btn.style.background = "var(--sage)";
          const rec = state.certified[h.id][l.code];
          btn.textContent = `${l.label}: bestätigt (${rec.date}) — rückgängig?`;
        } else {
          btn.textContent = `${l.label}${selfDone ? " — bestätigen" : " — noch nicht selbst geübt, trotzdem bestätigen"}`;
        }
        btn.addEventListener("click", async ()=>{
          if(certified){
            if(!confirm(`Bestätigung für "${h.title}" (${l.label}) wirklich rückgängig machen?`)) return;
            btn.disabled = true; btn.textContent = "Entferne …";
            await uncertifyHymn(u.id, h.id, l.code);
            if(state.certified[h.id]) delete state.certified[h.id][l.code];
            render();
            return;
          }
          btn.disabled = true; btn.textContent = "Speichere …";
          await certifyHymn(u.id, h.id, l.code, state.prueferName);
          if(!state.certified[h.id]) state.certified[h.id] = {};
          state.certified[h.id][l.code] = {by: state.prueferName, date: new Date().toLocaleDateString("de-CH")};
          render();
        });
        langRow.appendChild(btn);
      });
      row.appendChild(langRow);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  });

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = "Alle Prüfer teilen sich aktuell ein gemeinsames Passwort. Für mehr Sicherheit könnt ihr später jedem Prüfer einen eigenen, persönlichen Zugang geben.";
  wrap.appendChild(note);

  return wrap;
}

/* ---------------- PWA: Installierbar machen + eigenes "App installieren"-Banner ----------------
   Chrome/Android/Desktop lösen das Ereignis "beforeinstallprompt" aus, wenn die Seite die
   Installierbarkeits-Kriterien erfüllt (Manifest + Service Worker vorhanden). Wir fangen es
   sofort ab (damit der Browser seinen eigenen, generischen Hinweis NICHT zeigt) und lösen
   das Installations-Fenster stattdessen selbst über unseren eigenen Banner aus, sobald sich
   jemand angemeldet hat.
   iOS/Safari kennt dieses Ereignis nicht — dort zeigen wir stattdessen eine kurze Anleitung
   ("Teilen" → "Zum Home-Bildschirm"), da iOS keine programmatische Installation erlaubt. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

let deferredInstallPrompt = null;
function isIosDevice(){
  return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
}
function isAlreadyInstalled(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function maybeShowInstallBanner(){
  if(isAlreadyInstalled()) return;
  if(localStorage.getItem("installBannerDismissed")) return;
  // Nur anzeigen, wenn jemand angemeldet ist (Diakon oder Prüfer) — nicht schon auf der Login-Seite.
  if(state.role==="diakon" && !state.profile) return;
  if(state.role==="pruefer" && !state.prueferAuthenticated) return;
  const banner = document.getElementById("installBanner");
  const text = document.getElementById("installBannerText");
  const btn = document.getElementById("installBannerBtn");
  if(!banner) return;
  if(deferredInstallPrompt){
    text.textContent = "Diese App auf deinem Handy installieren, für schnelleren Zugriff?";
    btn.style.display = "";
    btn.textContent = "Installieren";
  } else if(isIosDevice()){
    text.textContent = "App installieren: Tippe unten auf \"Teilen\" und dann auf \"Zum Home-Bildschirm\".";
    btn.style.display = "none";
  } else {
    return; // kein Installations-Weg verfügbar (z. B. Browser unterstützt es nicht)
  }
  banner.style.display = "flex";
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  maybeShowInstallBanner();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerClose").addEventListener("click", ()=>{
  localStorage.setItem("installBannerDismissed", "1");
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerBtn").addEventListener("click", async ()=>{
  if(!deferredInstallPrompt) return;
  document.getElementById("installBanner").style.display = "none";
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

/* ---------------- Start ---------------- */
async function init(){
  root.innerHTML = `<div style="padding:60px 20px; text-align:center; color:var(--muted);">Lädt …</div>`;
  await pruefeUrlHash();
  await loadProfile();
  if(state.profile){
    await loadProgress();
    state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
  }
  render();
  maybeShowInstallBanner();
}
init();
</script>
