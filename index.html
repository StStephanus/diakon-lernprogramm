function renderPrueferGate(){
  const wrap = document.createElement("div");
  wrap.className = "profile-gate";

  if(!state.prueferPasswordOk){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Prüfer-Bereich</h2>
      <p>Dieser Bereich ist nur für Verantwortliche, die Antworten bestätigen dürfen. Bitte Zahlencode eingeben.</p>
      <div class="field">
        <label>Zahlencode</label>
        <input type="password" id="prueferPw" placeholder="Zahlencode" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
      </div>
      <button class="btn" id="prueferGoBtn">Weiter</button>
      ${state.prueferError ? `<div class="error-text">${state.prueferError}</div>` : ""}
    `;
    const pwInput = wrap.querySelector("#prueferPw");
    pwInput.value = state.prueferPasswordInput;
    const submit = ()=>{
      if(pwInput.value === PRUEFER_PASSWORD){
        state.prueferPasswordOk = true;
        state.prueferPwKept = pwInput.value;
        state.prueferError = "";
      } else {
        state.prueferError = "Falscher Code.";
        state.prueferPasswordInput = pwInput.value;
      }
      render();
    };
    wrap.querySelector("#prueferGoBtn").addEventListener("click", submit);
    pwInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
    return wrap;
  }

  // Schritt 2: Land
  if(!state.prueferLand){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Welches Land?</h2>
      <p>Du siehst danach nur die Diakone der gewählten Stadt.</p>
      <div id="landBtns">${LAENDER.map(l=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-land="${l.name}">${l.name}</button>`).join("")}</div>
    `;
    wrap.querySelectorAll("#landBtns button").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.prueferLand = btn.dataset.land; render(); });
    });
    return wrap;
  }

  // Schritt 3: Stadt
  if(!state.prueferStadt){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Welche Stadt?</h2>
      <p>${state.prueferLand}</p>
      <div id="stadtBtns">${staedteVon(state.prueferLand).map(s=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-stadt="${s}">${s}</button>`).join("")}</div>
      <div class="crumb" id="landZurueck" style="margin-top:22px;">Land ändern</div>
    `;
    wrap.querySelectorAll("#stadtBtns button").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.prueferStadt = btn.dataset.stadt; render(); });
    });
    wrap.querySelector("#landZurueck").addEventListener("click", ()=>{ state.prueferLand = null; render(); });
    return wrap;
  }

  // Schritt 4: Wer bist du?
  const namen = PRUEFER_NAMEN_FUER(state.prueferStadt);
  const weiter = async (name)=>{
    state.prueferName = name;
    state.prueferAuthenticated = true;
    state.view = "pruefer-home";
    state.allDiakone = await loadAllDiakone();
    render();
    maybeShowInstallBanner();
  };
  if(namen.length){
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Wer bestätigt gerade?</h2>
      <p>${state.prueferStadt}: Wähle deinen Namen, damit Bestätigungen zugeordnet werden können.</p>
      <div id="nameBtns">${namen.map(n=>`<button class="btn secondary" style="display:block; width:100%; margin-top:10px;" data-name="${n}">${n}</button>`).join("")}</div>
      <div class="crumb" id="stadtZurueck" style="margin-top:22px;">Stadt ändern</div>
    `;

      btn.addEventListener("click", ()=>weiter(btn.dataset.name));
    });
  } else {
    wrap.innerHTML = `
      <h2 class="serif" style="font-size:26px;">Wer bestätigt gerade?</h2>
      <p>${state.prueferStadt}: Gib deinen Namen ein, damit Bestätigungen zugeordnet werden können.</p>
      <div class="field"><label>Dein Name</label><input type="text" id="prueferNameInput" placeholder="Vorname Nachname" /></div>
      <button class="btn" id="prueferNameGo">Weiter</button>

    wrap.querySelector("#prueferNameGo").addEventListener("click", go);
    wrap.querySelector("#prueferNameInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") go(); });
  }
  wrap.querySelector("#stadtZurueck").addEventListener("click", ()=>{ state.prueferStadt = null; render(); });
  return wrap;
}

function renderDiakonAuthGate(){
  const wrap = document.createElement("div");
  wrap.className = "profile-gate";

  const header = document.createElement("div");
  header.innerHTML = `<h2 class="serif" style="font-size:26px;">${T("Willkommen")}</h2>
    <p>${T("Melde dich an oder registriere dich, um deinen persönlichen Lernfortschritt zu speichern.")}</p>`;
  wrap.appendChild(header);

  const tabs = document.createElement("div");
  tabs.className = "auth-tabs";
  tabs.innerHTML = `
    <button class="auth-tab ${state.authTab==='login'?'active':''}" data-tab="login">${T("Anmelden")}</button>
    <button class="auth-tab ${state.authTab==='register'?'active':''}" data-tab="register">${T("Registrieren")}</button>
  `;
  tabs.addEventListener("click",(e)=>{
    const b = e.target.closest("button"); if(!b) return;
    state.authTab = b.dataset.tab; state.authError = "";
    render();
  });
  wrap.appendChild(tabs);

  const form = document.createElement("div");

  if(state.authTab === "register"){
    form.innerHTML = `
      <div class="field"><label>${T("Vor- und Nachname")}</label><input type="text" id="regName" name="username" autocomplete="username" autocapitalize="words" placeholder="${T("z. B. Mina Tadros")}" /></div>
      <div class="field"><label>${T("Geburtsdatum")}</label><input type="date" id="regGeburtsdatum" /></div>
      <div class="field-row">
        <div class="field"><label>${T("Land")}</label>
          <select id="regLand"><option value="">${T("Bitte wählen")}</option>${LAENDER.map(l=>`<option value="${l.name}">${T(l.name)}</option>`).join("")}</select></div>
        <div class="field"><label>${T("Stadt")}</label>
          <select id="regStadt" disabled><option value="">${T("Zuerst Land wählen")}</option></select></div>
      </div>
      <div class="field"><label>${T("Passwort")}</label><input type="password" id="regPassword" name="password" autocomplete="new-password" /></div>
      <button class="btn" id="regBtn">${T("Registrieren")}</button>
      ${state.authError ? `<div class="error-text">${state.authError}</div>` : ""}
    `;
    wrap.appendChild(form);
    const regLand = wrap.querySelector("#regLand");
    const regStadt = wrap.querySelector("#regStadt");
    regLand.addEventListener("change", ()=>{
      const st = staedteVon(regLand.value);
      regStadt.innerHTML = st.length
        ? `<option value="">${T("Bitte wählen")}</option>` + st.map(s=>`<option value="${s}">${T(s)}</option>`).join("")
        : `<option value="">${T("Zuerst Land wählen")}</option>`;
      regStadt.disabled = st.length===0;
    });
    const regBtn = wrap.querySelector("#regBtn");
    regBtn.addEventListener("click", async ()=>{
      const { vorname, nachname } = splitFullName(wrap.querySelector("#regName").value);
      const geburtsdatum = wrap.querySelector("#regGeburtsdatum").value;
      const password = wrap.querySelector("#regPassword").value;
      const land = regLand.value;
      const stadt = regStadt.value;
      if(!vorname || !nachname){
        state.authError = T("Bitte Vor- und Nachnamen eingeben."); render(); return;
      }
      if(!geburtsdatum || !password || !land || !stadt){
        state.authError = T("Bitte alle Felder ausfüllen."); render(); return;
      }
      if(password.length < 6){
        state.authError = T("Das Passwort muss mindestens 6 Zeichen haben."); render(); return;
      }
      regBtn.disabled = true; regBtn.textContent = T("Registriere …");
      const result = await registerAccount(vorname, nachname, password, geburtsdatum, land, stadt);
      if(result.error){
        state.authError = result.error; render(); return;
      }
      await loadProfile();
      await loadProgress();
      state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
      state.authError = "";
      render();
      maybeShowInstallBanner();
    });
  } else {
    form.innerHTML = `
      <div class="field"><label>${T("Vor- und Nachname")}</label><input type="text" id="loginName" name="username" autocomplete="username" autocapitalize="words" placeholder="${T("z. B. Mina Tadros")}" /></div>
      <div class="field"><label>${T("Passwort")}</label><input type="password" id="loginPassword" name="password" autocomplete="current-password" /></div>
      <button class="btn" id="loginBtn">${T("Anmelden")}</button>
      ${state.authError ? `<div class="error-text">${state.authError}</div>` : ""}
    `;
    wrap.appendChild(form);
    const loginBtn = wrap.querySelector("#loginBtn");
    loginBtn.addEventListener("click", async ()=>{
      const loginFull = wrap.querySelector("#loginName").value;
      const { vorname, nachname } = splitFullName(loginFull);
      const password = wrap.querySelector("#loginPassword").value;
      if(!vorname || !nachname || !password){
        state.authError = T("Bitte Vor- und Nachnamen und Passwort eingeben."); render(); return;
      }
      loginBtn.disabled = true; loginBtn.textContent = T("Melde an …");
      const result = await loginAccount(loginFull, password);
      if(result.error){
        state.authError = T("Name oder Passwort ist falsch."); render(); return;
      }
      await loadProfile();
      await loadProgress();
      state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
      state.authError = "";
      render();
      maybeShowInstallBanner();
    });
  }

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = T("Deine Anmeldedaten werden sicher über Supabase verwaltet.");
  wrap.appendChild(note);

  return wrap;
}

function renderHome(){
  const wrap = document.createElement("div");
  const stufe = state.profile.stufe;
  const rewardDone = allHymnsCertified(stufe);
  const hauptCrumb = document.createElement("div");
  hauptCrumb.className = "crumb";
  hauptCrumb.textContent = T("Hauptmenü");
  hauptCrumb.addEventListener("click", ()=>{ state.view="menu"; render(); });
  appendNavRow(wrap, hauptCrumb);
  wrap.appendChild(sectionTitle(T("Lernprogramm")));

  if(rewardDone){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:18px; padding:14px 16px; background:var(--tint-gold); border:1px solid var(--gold); border-radius:6px;";
    banner.innerHTML = `<span style="font-size:14px;">${T("🏅 Du hast wirklich <strong>alle</strong> Antworten (Pflicht + freiwillig) bestätigt bekommen — besonders gut gemacht!")}</span>`;
    wrap.appendChild(banner);
  }
  // Zertifikat: nur die jeweils höchste abgeschlossene Stufe wird gezeigt —
  // das Zertifikat der nächsten Stufe ersetzt das der vorherigen.
  const hoechsteAbgeschlosseneStufe = [3,2,1].find(t => tierFullyCertified(t));
  if(hoechsteAbgeschlosseneStufe){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:18px; padding:14px 16px; background:var(--tint-burg); border:1px solid var(--burgundy); border-radius:6px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;";
    banner.innerHTML = `<span style="font-size:14px;">${T("Alle Pflicht-Antworten der Stufe {n} bestätigt — dein Zertifikat ist bereit.", {n: hoechsteAbgeschlosseneStufe})}</span>`;
    const btn = document.createElement("button");
    btn.className = "btn"; btn.style.margin="0"; btn.textContent = T("Stufe {n}-Zertifikat ansehen", {n: hoechsteAbgeschlosseneStufe});
    btn.addEventListener("click", ()=>{ state.stufenZertifikatStufe = hoechsteAbgeschlosseneStufe; state.view = "stufenzertifikat"; render(); });
    banner.appendChild(btn);
    wrap.appendChild(banner);
  }

  const list = document.createElement("div");
  list.style.marginTop = "20px";
  STATIONS.forEach((s, i)=>{
    const done = stationSelfDoneCount(s, stufe);
    const certCount = stationCertifiedCount(s, stufe);
    const mandCount = mandatoryHymns(s, stufe).length;
    const voluntCount = voluntaryHymns(s, stufe).length;
    const voluntCertCount = stationVoluntCertifiedCount(s, stufe);
    const voluntDone = stationVoluntSelfDoneCount(s, stufe);
    let metaText, stationDone;
    if(stufe < 3){
      // Stufe 1 und 2 kennen keine "Pflicht/freiwillig"-Unterscheidung — jede freigeschaltete Antwort
      // dieser Stufe muss gelernt werden, daher einfach "X von Y Antworten".
      const totalCount = mandCount + voluntCount;
      const totalCert = certCount + voluntCertCount;
      const totalDone = done + voluntDone;
      if(totalCount>0){
        metaText = T("{c}/{t} Antworten bestätigt ({d} selbst geübt)", {c:totalCert, t:totalCount, d:totalDone});
      } else if(s.hymns.length>0){
        const minTier = Math.min(...s.hymns.map(h=>h.tier));
        metaText = T("Diese Antworten werden erst ab Stufe {n} freigeschaltet.", {n:minTier});
      } else {
        metaText = "";
      }
      stationDone = totalCount>0 && totalCert===totalCount;
    } else {
      metaText = mandCount>0
        ? T("{c}/{t} Pflicht-Antworten bestätigt ({d} selbst geübt)", {c:certCount, t:mandCount, d:done}) + (voluntCount>0 ? T(" · {c}/{t} freiwillige Antworten bestätigt ({d} selbst geübt)", {c:voluntCertCount, t:voluntCount, d:voluntDone}) : "")
        : (voluntCount>0 ? T("{c}/{t} freiwillige Antworten bestätigt ({d} selbst geübt)", {c:voluntCertCount, t:voluntCount, d:voluntDone}) : "");
      stationDone = mandCount>0 ? certCount===mandCount : (voluntCount>0 && voluntCertCount===voluntCount);
    }
    const row = document.createElement("div");
    row.className = "station-row";
    row.innerHTML = `
      <div class="station-num">${i+1}</div>
      <div class="station-body">
        <div class="station-title">${T(s.title)}</div>
        <div class="station-meta">${metaText}</div>
      </div>
      ${stationDone ? `<div class="badge done">${T("Fertig")}</div>` : ""}
    `;
    row.addEventListener("click", ()=>{ state.currentStationId = s.id; state.view="station"; render(); });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  wrap.appendChild(versEl(VERSE.ps47_7, "on-light"));


  return wrap;
}

  title.className = "serif";

  title.textContent = T(s.title);
  wrap.appendChild(title);

  const hint = document.createElement("p");
  hint.style.cssText = "color:var(--muted); font-size:13px; margin-top:4px;";
  hint.textContent = T("Die Kürzel zeigen, in welcher Sprache du eine Antwort schon geübt hast.");
  wrap.appendChild(hint);

  if(s.id === "s1"){
    const erkl = document.createElement("div");
    erkl.className = "info-box";
    erkl.innerHTML = `<span class="ib-title">${T("Was ist das hier?")}</span>${T("Diese Antworten zählen zu den grundlegendsten Antworten eines Diakons und kommen in der koptischen Liturgie an mehreren Stellen vor. Übe sie gut, denn du wirst sie oft brauchen.")}`;
    wrap.appendChild(erkl);
  }

  if(s.hymns.length===0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>${T("Inhalte folgen bald")}</h3><p>${T("Die Antworten für diese Station werden noch ergänzt.")}</p>`;
    wrap.appendChild(empty);
    return wrap;
  }

  const stufe = state.profile.stufe;
  const list = document.createElement("div");
  list.style.marginTop = "14px";
  s.hymns.forEach(h=>{
    const unlocked = hymnUnlocked(h, stufe);
    const hymnLangs = LANGS.filter(l => h.content[l.code]);
    const row = document.createElement("div");

    if(!unlocked){
      row.className = "hymn-row locked";
      row.innerHTML = `
        <div class="hymn-title-group">
          <span class="hymn-title">${hymnTitle(h)}</span>
          <div class="lock-badge">${T("🔒 ab Stufe {n}", {n:h.tier})}</div>
        </div>
      `;
      list.appendChild(row);
      return;
    }

    const learnedLangs = langsLearnedFor(state.progress, h.id);
    row.className = "hymn-row";
    const chips = hymnLangs.map(l=>{
      const done = learnedLangs.includes(l.code);
      const cert = isHymnLangCertified(h.id, l.code);
      const abbr = l.code==="de"?"DE":(l.code==="cop"?(isLoc()?"CO":"KO"):"AR");
      const cls = [done?'done':'', cert?'certified':''].filter(Boolean).join(' ');
      const titleTxt = cert ? T("{lang} — vom Prüfer bestätigt", {lang:T(l.label)}) : (done ? T("{lang} — selbst geübt", {lang:T(l.label)}) : T(l.label));
      return `<div class="lang-chip ${cls}" title="${titleTxt}">${abbr}</div>`;
    }).join("");
    const voluntBadge = h.mandatory===false ? `<div class="volunt-badge">${T("freiwillig")}</div>` : "";
    row.innerHTML = `
      <div class="hymn-title-group">
        <span class="hymn-title">${hymnTitle(h)}</span>
        ${voluntBadge}
      </div>
      <div class="lang-chips">${chips}</div>
    `;
    row.addEventListener("click", ()=>{
      state.currentHymnId = h.id;
      state.currentLang = hymnLangs[0].code;
      state.view = "hymn";
      render();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderHymn(){
  const {hymn, station} = findHymn(state.currentHymnId);
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "" + T(station.title);
  crumb.addEventListener("click", ()=>{ state.view="station"; render(); });
  appendNavRow(wrap, crumb);

  if(!hymnUnlocked(hymn, state.profile.stufe)){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>${T("Noch gesperrt")}</h3><p>${T("Diese Antwort gehört zu Stufe {n} — sie wird freigeschaltet, sobald du diese Stufe erreichst.", {n:hymn.tier})}</p>`;
    wrap.appendChild(empty);
    return wrap;
  }

  const titleRow = document.createElement("div");
  titleRow.style.cssText = "display:flex; align-items:center; gap:10px; flex-wrap:wrap;";
  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = hymnTitle(hymn);
  titleRow.appendChild(title);
  if(hymn.mandatory===false){
    const voluntSpan = document.createElement("span");
    voluntSpan.className = "volunt-badge";
    voluntSpan.textContent = T("freiwillig");
    titleRow.appendChild(voluntSpan);
  }
  wrap.appendChild(titleRow);

  const woText = hymnWo(hymn, station);
  const woBox = document.createElement("div");
  woBox.className = "info-box" + (woText ? "" : " leer");
  woBox.innerHTML = `<span class="ib-title">${T("Wo in der Liturgie?")}</span><span class="ib-body">${woText ? T(woText) : T("Hier steht bald, an welcher Stelle der Liturgie diese Antwort gesungen wird.")}</span>`;
  wrap.appendChild(woBox);

  const hymnLangs = LANGS.filter(l => hymn.content[l.code]);
  if(!hymn.content[state.currentLang]) state.currentLang = hymnLangs[0].code;

  const tabs = document.createElement("div");
  tabs.className = "lang-tabs";
  hymnLangs.forEach(l=>{
    const b = document.createElement("button");
    b.className = "lang-tab" + (state.currentLang===l.code? " active":"");
    b.textContent = T(l.label);
    b.addEventListener("click", ()=>{ state.currentLang=l.code; render(); });
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);
  if(hymnLangs.length < LANGS.length){
    const note = document.createElement("p");
    note.style.cssText = "color:var(--muted); font-size:12px; margin-top:-14px; margin-bottom:18px;";
    note.textContent = T("Diese Antwort wird bei uns nur in {langs} gesungen.", {langs: hymnLangs.map(l=>T(l.label)).join(T(" und "))});
    wrap.appendChild(note);
  }

  const content = hymn.content[state.currentLang];

  const player = document.createElement("div");
  player.className = "player";
  player.innerHTML = `
    <div class="player-row">
      <button class="play-btn" id="playBtn"><span class="icon-play">▶</span><span class="icon-pause"><span></span><span></span></span></button>
      <button class="stop-btn" id="stopBtn" title="${T("Stopp")}">■</button>
      <div>
        <div style="font-weight:600;">${T("Aufnahme anhören")}</div>
        <div class="audio-note" id="audioStatus">${T("Bereit")}</div>
      </div>
    </div>
    <div class="seek-row">
      <span class="seek-time" id="seekCurrent">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" />
      <span class="seek-time total" id="seekTotal">0:00</span>
    </div>
  `;
  const statusEl = player.querySelector("#audioStatus");
  const playBtn = player.querySelector("#playBtn");
  const stopBtn = player.querySelector("#stopBtn");
  const seekBar = player.querySelector("#seekBar");
  const seekCurrentEl = player.querySelector("#seekCurrent");
  const seekTotalEl = player.querySelector("#seekTotal");
  const formatTime = (t)=>{
    if(!isFinite(t) || t<0) t = 0;
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ":" + (s<10? "0":"") + s;
  };
  let userIsSeeking = false;
  const thisKey = hymn.id + "_" + state.currentLang;
  const setStatus = (s)=>{
    if(s==="loading"){ statusEl.textContent = T("Lädt …"); playBtn.classList.remove("show-pause"); }
    else if(s==="playing"){ statusEl.textContent = T("Spielt ab …"); playBtn.classList.add("show-pause"); }
    else if(s==="paused"){ statusEl.textContent = T("Pausiert"); playBtn.classList.remove("show-pause"); }
    else if(s==="missing"){ statusEl.textContent = T("Keine Aufnahme für diese Sprache hinterlegt (Platzhalter-Ton)"); playBtn.classList.remove("show-pause"); }
    else { statusEl.textContent = T("Bereit"); playBtn.classList.remove("show-pause"); }
  };
  const setTime = (cur, dur)=>{
    if(userIsSeeking) return;
    seekCurrentEl.textContent = formatTime(cur);
    seekTotalEl.textContent = formatTime(dur);
    seekBar.value = dur>0 ? Math.round((cur/dur)*1000) : 0;
  };
  // Falls dieselbe Aufnahme (gleiche Antwort + Sprache) schon läuft/pausiert ist (z. B. weil
  // der Nutzer zwischendurch nur den Selbst-geübt-Haken gesetzt hat und die Seite neu
  // gezeichnet wurde), spiegelt die Anzeige direkt deren aktuellen Zustand statt "Bereit".
  if(currentAudioKey === thisKey && currentAudioEl){
    setStatus(currentAudioEl.paused ? "paused" : "playing");
    setTime(currentAudioEl.currentTime, currentAudioEl.duration || 0);
  }
  playBtn.addEventListener("click", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl){
      if(currentAudioEl.paused) currentAudioEl.play().catch(()=>{});
      else currentAudioEl.pause();
    } else {
      playHymnAudio(hymn.id, state.currentLang, { onStatus: setStatus, onTime: setTime });
    }
  });
  stopBtn.addEventListener("click", ()=>{
    stopHymnAudio();
    setStatus("idle");
    setTime(0, 0);
  });
  seekBar.addEventListener("input", ()=>{ userIsSeeking = true; });
  seekBar.addEventListener("change", ()=>{
    if(currentAudioKey === thisKey && currentAudioEl && isFinite(currentAudioEl.duration)){
      currentAudioEl.currentTime = (seekBar.value/1000) * currentAudioEl.duration;
    }
    userIsSeeking = false;
  });
  wrap.appendChild(player);

  wrap.appendChild(readTools());
  const textBlock = document.createElement("div");
  textBlock.className = "text-block";
  let mainText = content.text || content.translit || "";
  let mainIsHtml = !!content.html;
  if(UI_LANG === "ar" && isLoc() && content.script){   // arabische Schrift nur im arabischen Modus, sonst Franko-Arabisch
    mainText = content.script.split("\n").map(l => l.replace(/&/g,"&amp;").replace(/</g,"&lt;")).join("<br>");
    mainIsHtml = true;
  }
  textBlock.dir = /[\u0600-\u06FF]/.test(mainText) ? "rtl" : "ltr";   // echte arabische Schrift läuft von rechts nach links
  if(mainIsHtml){ textBlock.innerHTML = mainText; } else { textBlock.textContent = mainText; }
  wrap.appendChild(textBlock);

  const selfRow = document.createElement("div");
  selfRow.className = "self-learn-row";
  const currentLangLabel = T(LANGS.find(l=>l.code===state.currentLang).label);
  const learned = !!(state.progress[hymn.id] && state.progress[hymn.id][state.currentLang]);
  selfRow.innerHTML = `
    <div>
      <div style="font-weight:600; font-size:15px;">${T("Ich habe das auf {lang} geübt", {lang: currentLangLabel})}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">${T("Nur dein persönlicher Fortschritt für diese Sprache — die offizielle Bestätigung gibt der Prüfer.")}</div>
    </div>
    <div class="toggle ${learned?'on':''}" id="selfToggle"><div class="knob"></div></div>
  `;
  selfRow.querySelector("#selfToggle").addEventListener("click", async ()=>{
    await setProgress(hymn.id, state.currentLang, !learned);
    render();
  });
  wrap.appendChild(selfRow);

  const certInfo = document.createElement("div");
  const certForLang = isHymnLangCertified(hymn.id, state.currentLang);
  if(certForLang){
    const rec = state.certified[hymn.id][state.currentLang];
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--tint-burg); border:1px solid var(--burgundy); border-radius:6px; font-size:13px; color:var(--burg-t); font-weight:600;";
    certInfo.textContent = T("✓ Auf {lang} vom Prüfer bestätigt ({by}, {date}) — du kannst trotzdem jederzeit weiter üben.", {lang: currentLangLabel, by: rec.by, date: rec.date});
  } else {
    certInfo.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--parchment-2); border:1px solid var(--line); border-radius:6px; font-size:13px; color:var(--muted);";
    certInfo.textContent = T("Auf {lang} noch nicht vom Prüfer bestätigt. Geh zu einem Prüfer in der Kirche, um diese Antwort in dieser Sprache vorzusingen.", {lang: currentLangLabel});
  }
  wrap.appendChild(certInfo);

  return wrap;
}

function renderStufenZertifikat(){
  const stufe = state.stufenZertifikatStufe;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = T("Zurück");
  crumb.addEventListener("click", ()=>{ state.view="home"; state.stufenZertifikatStufe=null; render(); });
  appendNavRow(wrap, crumb);

  // Alle Pflicht-Hymnen dieser Stufe einsammeln, um das letzte Bestätigungsdatum zu bestimmen
  const hymnIdsOfStufe = [];
  STATIONS.forEach(s=>{
    s.hymns.forEach(h=>{
      if(h.tier===stufe && h.mandatory!==false) hymnIdsOfStufe.push(h.id);
    });
  });
  const dates = hymnIdsOfStufe
    .map(id=>{
      const langs = certifiedLangsFor(id);
      const entries = langs.map(l=> state.certified[id] && state.certified[id][l]).filter(Boolean);
      return entries.map(e=>e.date).filter(Boolean);
    })
    .flat()
    .sort();
  const lastDate = dates.length? dates[dates.length-1] : new Date().toLocaleDateString("de-CH");

  const stufeNamen = { 1: T("Stufe 1"), 2: T("Stufe 2"), 3: T("Stufe 3") };
  const stufeAlter = { 1: T("unter 12 Jahren"), 2: T("zwischen 12 und 20 Jahren"), 3: T("ab 20 Jahren") };

  const cert = document.createElement("div");
  cert.className = "certificate";
  cert.innerHTML = `
    <div class="kicker">${T("KOPTISCH-ORTHODOXE KIRCHE ZÜRICH")}</div>
    <h2 class="serif">${T("Diakonenzertifikat der Stufe {n}", {n:stufe})}</h2>
    <div style="font-size:14px; color:var(--muted); margin-top:10px;">${T("verliehen an")}</div>
    <div class="name">${state.profile.name}</div>
    <div class="desc">${T("hat alle Pflicht-Antworten der <strong>{stufe}</strong> (Altersgruppe {alter}) erfolgreich vor einem Verantwortlichen der Gemeinde vorgetragen und ist damit berechtigt, diese Antworten ab sofort in der Liturgie vorzutragen.", {stufe: (stufeNamen[stufe] || ("Stufe " + stufe)), alter: (stufeAlter[stufe] || "")})}</div>
    <div class="date">${T("Abgeschlossen am {date}", {date:lastDate})}</div>
  `;
  wrap.appendChild(cert);

  const printBtn = document.createElement("button");
  printBtn.className = "btn secondary";
  printBtn.style.marginTop = "18px";
  printBtn.textContent = T("Drucken / als PDF speichern");
  printBtn.addEventListener("click", ()=> window.print());
  wrap.appendChild(printBtn);

  return wrap;
}

/* ---------------- Prüfer-Ansicht ---------------- */
function renderPrueferHome(){
  const wrap = document.createElement("div");
  wrap.innerHTML = `<h2 class="serif" style="font-size:24px;">Diakone in ${state.prueferStadt}</h2>
    <p style="color:var(--muted); font-size:14px; margin-top:6px;">${state.prueferLand} · Wähle einen Diakon aus, um Stationen zu bestätigen.</p>
    <div class="crumb" id="stadtWechseln" style="margin-top:14px; margin-bottom:0;">Stadt wechseln</div>`;
  wrap.querySelector("#stadtWechseln").addEventListener("click", ()=>{
    state.prueferAuthenticated = false; state.prueferName = ""; state.prueferLand = null; state.prueferStadt = null;
    state.view = "pruefer-home"; render();
  });
  const list = document.createElement("div");
  list.style.marginTop = "16px";
  if(state.allDiakone.length===0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h3>Noch keine Diakone registriert</h3><p>Sobald sich jemand im Diakon-Bereich registriert, erscheint er hier.</p>`;
    list.appendChild(empty);
  }
  state.allDiakone.forEach(u=>{
    const fullName = u.vorname+" "+u.nachname;
    const row = document.createElement("div");
    row.className = "diakon-pick";
    row.style.flexWrap = "wrap";
    row.innerHTML = `
      <span class="diakon-open" style="flex:1; cursor:pointer;">${fullName}</span>
      <span class="diakon-open" style="color:var(--muted); font-size:13px; cursor:pointer;">öffnen →</span>
      <span class="diakon-pw" style="flex-basis:100%; margin-top:8px; color:var(--midnight); font-size:13px; text-decoration:underline; cursor:pointer;">Passwort zurücksetzen</span>
      <span class="diakon-delete" style="color:var(--burg-t); font-size:13px; text-decoration:underline; cursor:pointer; margin-left:14px; white-space:nowrap;">Löschen</span>
    `;
    row.querySelectorAll(".diakon-open").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const effectiveStufe = Math.max(u.stufe || 1, ageStufeFromBirthdate(u.geburtsdatum));
        state.pruefer_selectedDiakon = {name: fullName, id: u.id, stufe: effectiveStufe};
        state.certified = await loadCertified(u.id);
        const { data } = await sb.from("progress").select("hymn_id, lang, learned").eq("user_id", u.id);
        state.pruefer_progress = {};
        (data||[]).forEach(row=>{
          if(!state.pruefer_progress[row.hymn_id]) state.pruefer_progress[row.hymn_id] = {};
          state.pruefer_progress[row.hymn_id][row.lang] = row.learned;
        });
        state.view = "pruefer-station";
        render();
      });
    });
    row.querySelector(".diakon-pw").addEventListener("click", async (e)=>{
      e.stopPropagation();
      const pw = prompt(`Neues Passwort für "${fullName}" (mindestens 6 Zeichen):`);
      if(pw === null) return;
      if(pw.length < 6){ alert("Das Passwort muss mindestens 6 Zeichen haben."); return; }
      const r = await resetDiakonPassword(u.id, pw);
      alert(r.ok ? `Passwort für "${fullName}" wurde geändert. Teile es dem Diakon mit; er kann es nach der Anmeldung nutzen.` : r.msg);
    });
    row.querySelector(".diakon-delete").addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(!confirm(`"${fullName}" wirklich vollständig löschen? Profil, Fortschritt und alle Bestätigungen werden entfernt. Das kann nicht rückgängig gemacht werden.`)) return;
      await deleteDiakon(u.id);
      state.allDiakone = await loadAllDiakone();
      render();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderPrueferStation(){
  const u = state.pruefer_selectedDiakon;
  const wrap = document.createElement("div");
  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = "Alle Diakone";
  crumb.addEventListener("click", ()=>{ state.view="pruefer-home"; render(); });
  appendNavRow(wrap, crumb);

  const title = document.createElement("h2");
  title.className = "serif";
  title.style.fontSize = "24px";
  title.textContent = u.name;
  wrap.appendChild(title);

  const sub = document.createElement("p");
  sub.style.cssText = "color:var(--muted); font-size:13px; margin-top:6px;";
  sub.textContent = "Bestätige jede Antwort einzeln, nachdem sie dir vorgesungen wurde. Angemeldet als: " + state.prueferName;
  wrap.appendChild(sub);

  if(u.stufe < 3 && tierFullyCertified(u.stufe)){
    const banner = document.createElement("div");
    banner.style.cssText = "margin-top:14px; padding:12px 14px; background:var(--tint-gold); border:1px solid var(--gold); border-radius:6px; font-size:13px;";
    banner.textContent = `Stufe ${u.stufe} ist vollständig bestätigt. Beim nächsten Login von ${u.name} wird automatisch Stufe ${u.stufe+1} freigeschaltet.`;
    wrap.appendChild(banner);
  }

  STATIONS.forEach((s,i)=>{
    if(s.hymns.length===0) return;
    const stationHeader = document.createElement("h3");
    stationHeader.className = "serif";
    stationHeader.style.cssText = "font-size:18px; margin-top:26px; margin-bottom:4px;";
    stationHeader.textContent = (i+1) + ". " + s.title;
    wrap.appendChild(stationHeader);

    const list = document.createElement("div");
    s.hymns.forEach(h=>{
      const unlocked = hymnUnlocked(h, u.stufe);
      const row = document.createElement("div");
      row.className = "approve-row";
      row.style.flexDirection = "column";
      row.style.alignItems = "stretch";
      row.style.gap = "10px";

      if(!unlocked){
        row.style.opacity = ".55";
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `<b>${h.title}</b> <span class="lock-badge">🔒 ab Stufe ${h.tier}</span>`;
        row.appendChild(info);
        list.appendChild(row);
        return;
      }

      const hymnLangs = LANGS.filter(l => h.content[l.code]);
      const learnedLangCodes = LANGS.filter(l => (state.pruefer_progress[h.id]||{})[l.code]).map(l=>l.code);
      const voluntTag = h.mandatory===false ? ` <span class="volunt-badge">freiwillig</span>` : "";

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<b>${h.title}${voluntTag}</b>`;
      row.appendChild(info);

      const langRow = document.createElement("div");
      langRow.style.cssText = "display:flex; flex-wrap:wrap; gap:8px;";
      hymnLangs.forEach(l=>{
        const selfDone = learnedLangCodes.includes(l.code);
        const certified = isHymnLangCertified(h.id, l.code);
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.style.margin = "0";
        btn.style.fontSize = "13px";
        btn.style.padding = "8px 12px";
        if(certified){
          btn.style.background = "var(--sage)";
          const rec = state.certified[h.id][l.code];
          btn.textContent = `${l.label}: bestätigt (${rec.date}) — rückgängig?`;
        } else {
          btn.textContent = `${l.label}${selfDone ? " — bestätigen" : " — noch nicht selbst geübt, trotzdem bestätigen"}`;
        }
        btn.addEventListener("click", async ()=>{
          if(certified){
            if(!confirm(`Bestätigung für "${h.title}" (${l.label}) wirklich rückgängig machen?`)) return;
            btn.disabled = true; btn.textContent = "Entferne …";
            await uncertifyHymn(u.id, h.id, l.code);
            if(state.certified[h.id]) delete state.certified[h.id][l.code];
            render();
            return;
          }
          btn.disabled = true; btn.textContent = "Speichere …";
          await certifyHymn(u.id, h.id, l.code, state.prueferName);
          if(!state.certified[h.id]) state.certified[h.id] = {};
          state.certified[h.id][l.code] = {by: state.prueferName, date: new Date().toLocaleDateString("de-CH")};
          render();
        });
        langRow.appendChild(btn);
      });
      row.appendChild(langRow);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  });

  const note = document.createElement("div");
  note.className = "footnote";
  note.textContent = "Alle Prüfer teilen sich aktuell ein gemeinsames Passwort. Für mehr Sicherheit könnt ihr später jedem Prüfer einen eigenen, persönlichen Zugang geben.";
  wrap.appendChild(note);

  return wrap;
}

/* ---------------- PWA: Installierbar machen + eigenes "App installieren"-Banner ----------------
   Chrome/Android/Desktop lösen das Ereignis "beforeinstallprompt" aus, wenn die Seite die
   Installierbarkeits-Kriterien erfüllt (Manifest + Service Worker vorhanden). Wir fangen es
   sofort ab (damit der Browser seinen eigenen, generischen Hinweis NICHT zeigt) und lösen
   das Installations-Fenster stattdessen selbst über unseren eigenen Banner aus, sobald sich
   jemand angemeldet hat.
   iOS/Safari kennt dieses Ereignis nicht — dort zeigen wir stattdessen eine kurze Anleitung
   ("Teilen" → "Zum Home-Bildschirm"), da iOS keine programmatische Installation erlaubt. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

let deferredInstallPrompt = null;
function isIosDevice(){
  return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
}
function isAlreadyInstalled(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function maybeShowInstallBanner(){
  if(isAlreadyInstalled()) return;
  if(localStorage.getItem("installBannerDismissed")) return;
  // Nur anzeigen, wenn jemand angemeldet ist (Diakon oder Prüfer) — nicht schon auf der Login-Seite.
  if(state.role==="diakon" && !state.profile) return;
  if(state.role==="pruefer" && !state.prueferAuthenticated) return;
  const banner = document.getElementById("installBanner");
  const text = document.getElementById("installBannerText");
  const btn = document.getElementById("installBannerBtn");
  if(!banner) return;
  if(deferredInstallPrompt){
    text.textContent = T("Diese App auf deinem Handy installieren, für schnelleren Zugriff?");
    btn.style.display = "";
    btn.textContent = T("Installieren");
  } else if(isIosDevice()){
    text.textContent = T("App installieren: Tippe unten auf \"Teilen\" und dann auf \"Zum Home-Bildschirm\".");
    btn.style.display = "none";
  } else {
    return; // kein Installations-Weg verfügbar (z. B. Browser unterstützt es nicht)
  }
  banner.style.display = "flex";
}
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  maybeShowInstallBanner();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerClose").addEventListener("click", ()=>{
  localStorage.setItem("installBannerDismissed", "1");
  document.getElementById("installBanner").style.display = "none";
});
document.getElementById("installBannerBtn").addEventListener("click", async ()=>{
  if(!deferredInstallPrompt) return;
  document.getElementById("installBanner").style.display = "none";
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

/* iOS zeigt :active (Einsinken beim Antippen) nur, wenn ein Touch-Listener existiert */
document.addEventListener("touchstart", function(){}, {passive:true});

/* ---------------- Start ---------------- */
async function init(){
  document.documentElement.lang = UI_LANG;
  root.innerHTML = "";
  const splashWeg = ()=>{
    const sp = document.getElementById("splash");
    if(!sp) return;
    sp.classList.add("hide");
    setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
  };
  setTimeout(splashWeg, 9000);   // Sicherheit: nie dauerhaft hängen bleiben
  await pruefeUrlHash();
  await loadProfile();
  if(state.profile){
    await loadProgress();
    state.certified = await loadCertified(state.profile.id);
      await checkLernfortschrittPromotion();
  }
  render();
  updateOfflineBanner();
  splashWeg();
  maybeShowInstallBanner();
}
init();
</script>
